# DRAFT DEVELOPMENT CASE. Not a user-kernel check or qualified launch procedure.
# prepare_cases.py picks an offset absent from the accepted descriptor inventory.
# Change only the entry selector; keep the valid image and original object hash.
# File size helps choose the number; it does not establish the .text section size.
# A clean result for this deliberately unlisted entry is a qualification failure.
schema_version: 1
mode: sanitizer
ticket: WAITCHECK-INVALID-ENTRY
description: Deliberately unlisted entry in the accepted two-kernel object; not a clean-check control.
sanitizer_plan:
  target: gfx1250
  source:
    kind: kernel
    kernel:
      name: waitcheck_corrected
      code_object: REQUIRED_ACCEPTED_OBJECT_PATH
      code_object_sha256: REQUIRED_ACCEPTED_OBJECT_SHA256
      code_object_index: REQUIRED_IMAGE_INDEX
      entry_offset: REQUIRED_ENTRY_OFFSET
  scope:
    kind: kernel
  selection:
    requirement: top_dispatch_count
    top_n: 1
  sanitizers:
    - waitcheck
  policy:
    consan_policy: strict  # Schema field only; does not enable ConSan.
    on_missing_backend: fail
    timeout_seconds: 120
    waitcheck_max_diagnostics: 64
  output:
    report: sanitizer_report.json
