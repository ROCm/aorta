# Proton capture of a Triton elementwise kernel.
#
# Proton runs inside the workload's own interpreter (`python -m
# triton.profiler.proton`), so this recipe must be driven from an
# interpreter that has Triton installed -- normally a ROCm PyTorch
# container. See README.md.
#
#   aorta sweep run \
#       --recipe examples/profiling/proton/triton-vecadd/recipe.yaml \
#       --output ./profiling_results \
#       -- python examples/profiling/proton/triton-vecadd/vecadd.py \
#            --size 1048576 --iters 20
schema_version: 1
mode: probe

ticket: PROFILING-TRITON-VECADD

trials: 1
# Triton JIT-compiles on first launch; a cold kernel cache dominates the
# wall time of a one-kernel payload.
timeout_per_trial: 1800

mitigation_axis: [none]
diagnostic_axis: [none]

env_passthrough_mode: inherit

# Baseline Proton configuration on AMD: CLI attach, shadow context so time
# is attributed to the launching frame, hatchet tree output. These are also
# the collector's defaults -- spelled out here because this is the example
# people copy.
#
# `backend: "auto"` omits Proton's `-b` and lets Proton pick the backend
# matching the active runtime. On AMD that is `rocprofiler` from Triton 3.8.0
# onward and `roctracer` on 3.7.1 and earlier -- so `auto` is the only spelling
# correct on every version, at the cost of the artifact not recording which of
# the two ran (the run's env snapshot has the Triton version that settles it).
# Naming `rocprofiler` explicitly works on Triton 3.8.0 and newer but exits with
# an argparse "invalid choice: 'rocprofiler'" on 3.7.x and earlier, before your
# payload runs. Pinning either AMD backend also means leaving `mode: cli`:
# Proton's front-end initialises the HIP runtime only on the path where `-b` is
# absent -- still true in 3.8.0 -- so a pinned queue-intercepting backend
# captures an empty tree and the collector refuses the pairing. See
# examples/profiling/proton/amd-roctracer for the `mode: env` shape that
# pinning requires.
collect:
  proton:
    mode: "cli"
    backend: "auto"
    context: "shadow"
    data: "tree"
