# Proton capture *inside* one Triton kernel, on the `instrumentation` backend.
#
# The only Proton backend that attributes cycles to regions within a kernel,
# and the only one that installs no HSA queue interceptor -- which is why it is
# also the only one aorta's rocprof+proton conflict guard accepts. See
# README.md.
#
#   aorta sweep run \
#       --recipe examples/profiling/proton/amd-instrumentation/recipe.yaml \
#       --output ./profiling_results \
#       -- python examples/profiling/proton/amd-instrumentation/hotspot.py \
#            --size 65536 --steps 8
schema_version: 1
mode: probe

ticket: PROFILING-PROTON-AMD-INSTRUMENTATION

trials: 1
timeout_per_trial: 1800

mitigation_axis: [none]
diagnostic_axis: [none]

env_passthrough_mode: inherit

# `mode: env`, not `mode: cli`, because whether the Proton CLI forwards
# `-m/--mode` to `start()` depends on the Triton version. Triton 3.7.1 and
# earlier parse the flag and then call `start()` without it, so
# `instrumentation_mode` below is dropped there; Triton 3.8.0 forwards
# `mode=args.mode` and it lands. `mode: env` exports the value as
# `AORTA_PROTON_MODE` and the payload hands it to `proton.start()` itself, which
# takes effect on every version -- the reason this example keeps it, since an
# example is meant to work on whatever image you point it at. `mode: cli` is not
# refused here; the collector renders `--mode` and lets the installed Triton
# decide, because it cannot know from its own interpreter which one that is.
#
# Note this is a *different* reason from the one that forces `mode: env` on the
# sibling `amd-roctracer` recipe. On Triton 3.7.x and earlier that backend
# records nothing when Proton's CLI pins it, because the CLI initialises the
# HIP runtime only on the path where `-b` is absent and a queue interceptor
# must be installed first; measured on 3.8.0 the same pin captures normally, so
# a release does fix it, but the collector still refuses that combination on
# every version while 3.7.x images remain in use (ROCm/aorta#439). The
# instrumentation backend installs no interceptor and captures fine under a
# `-b instrumentation` CLI wrap (verified on 3.7.1); what `mode: cli` costs
# here is the version guarantee on the mode knob.
#
# `granularity` is deliberately ABSENT. The option pair
# `instrumentation_mode: default` + `granularity: warp` renders Proton's single
# `--mode` as the string `default:granularity=warp`, and Triton 3.7.1 rejects
# that at kernel exit with
#   RuntimeError: Only warp granularity is supported for now
# raised from `libproton.exit_instrumented_op`. Only the *string* spelling of
# the `granularity=` key is broken -- the bare `default` works, and so does the
# equivalent typed `triton.profiler.mode.Default(granularity="warp")` -- and
# warp granularity is this backend's own default on this version anyway, so
# omitting the key costs nothing. Whether a later release accepts the string
# spelling was not checked on 3.8.0; spell the key explicitly only on a build
# where you have confirmed it.
collect:
  proton:
    mode: "env"
    backend: "instrumentation"
    instrumentation_mode: "default"
    context: "shadow"
    data: "tree"
