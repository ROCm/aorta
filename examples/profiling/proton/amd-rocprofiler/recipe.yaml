# Proton capture on the `rocprofiler` backend, with PC sampling.
#
# SHIPPED UNVERIFIED -- for the mode, not the backend. `rocprofiler` is
# released as of Triton 3.8.0 (2026-08-28), whose CLI advertises
# `-b {cupti,rocprofiler,roctracer,instrumentation}`. Its `pcsampling` mode is
# not: on 3.8.0, `proton.start(backend="rocprofiler", mode="pcsampling")` raises
#   ValueError: [PROTON] RocprofSDKProfiler: unsupported mode: pcsampling
# because AMD PC sampling landed upstream after the 3.8.0 tag. So this recipe as
# written needs a post-3.8 `main` build and was never run end-to-end; everything
# else in this tree was. Check the backend with
#
#   python -c "from triton._C.libproton import proton as p; print(p.get_available_profilers())"
#
# -- an AttributeError means the installed Triton predates the backend registry
# entirely (3.7.1 and earlier). That list does not answer the mode question;
# `backend_mode: periodic_flushing` is what runs on a plain 3.8.0. See README.md.
#
#   aorta sweep run \
#       --recipe examples/profiling/proton/amd-rocprofiler/recipe.yaml \
#       --output ./profiling_results \
#       -- python examples/profiling/proton/amd-rocprofiler/gelu.py \
#            --size 4194304 --iters 50
schema_version: 1
mode: probe

ticket: PROFILING-PROTON-AMD-ROCPROFILER

trials: 1
timeout_per_trial: 1800

mitigation_axis: [none]
diagnostic_axis: [none]

env_passthrough_mode: inherit

# `mode: env`, not `mode: cli`, for two independent reasons.
#
# First, Triton's Proton CLI front-end calls its own `_select_backend()` only
# when `-b` is *absent*, and that call initialises the Triton HIP driver as a
# side effect. A queue-tracing AMD backend records nothing when it attaches
# ahead of the runtime it traces, so pinning one through `mode: cli` yields a
# 160-byte hatchet with a bare ROOT frame and an exit status of 0 -- the trial
# looks successful and carries no Proton metrics. The collector rejects
# `mode: cli` with an explicit roctracer/rocprofiler backend for that reason.
# Triton 3.8.0 does not fix this: line 73 of `third_party/proton/proton/proton.py`
# at the `v3.8.0` tag is still `backend = args.backend if args.backend else
# _select_backend()`.
#
# Second, whether the CLI forwards `-m/--mode` to `start()` depends on the
# version: Triton 3.8.0 passes `mode=args.mode` through, while 3.7.1 and earlier
# parse the flag and then call `start()` without it, dropping `backend_mode`
# below. In `mode: env` it is exported as `AORTA_PROTON_MODE` and the payload
# passes it to `proton.start(mode=...)` itself, which works on every version.
#
# `backend_mode: pcsampling` asks rocprofiler-sdk for statistical
# instruction-level attribution -- where in the kernel the samples land --
# rather than the whole-kernel spans `roctracer` reports. This is the line that
# needs a post-3.8 `main` build; the backend's other valid `backend_mode`,
# `periodic_flushing`, is accepted on 3.8.0.
collect:
  proton:
    mode: "env"
    backend: "rocprofiler"
    backend_mode: "pcsampling"
    context: "shadow"
    data: "tree"
