[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-aorta"
# The version is not hard-coded here: it is derived from git tags at build time
# by setuptools_scm (see [tool.setuptools_scm]). ``dynamic`` tells setuptools the
# version is supplied by the build backend, so there is a single source of truth
# (the ``vX.Y.Z`` tag) that both released wheels and local/editable installs read.
dynamic = ["version"]
description = "PyTorch compute-communication overlap debugging toolkit with GPU hardware queue evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AMD ROCm Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
keywords = ["gpu", "rocm", "amd", "pytorch", "cuda", "benchmark", "fsdp", "distributed-training", "hardware-queue"]

# Base dependencies (PyTorch installed separately - see requirements.txt)
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0.0",  # For aorta CLI
]

[project.scripts]
aorta = "aorta.cli:main"

# Plugin discovery: workloads register here via aorta.workloads entry-point group.
# Public workloads (when they land) register here; private workloads
# register from downstream packages' pyproject.toml under the same group.
#
# ``_subprocess`` is platform-internal: it wraps an opaque user launch
# command for ``aorta probe`` (issue #188). The leading underscore both
# (a) prevents collision with user-facing workload names and (b) marks
# the entry as visibly platform-internal in ``aorta triage list-workloads``
# when that command lands. Direct ``aorta run --workload _subprocess``
# invocations fail at ``SubprocessWorkload.setup()`` because the
# reserved argv config key is only injected by ``aorta probe``.
[project.entry-points."aorta.workloads"]
_subprocess = "aorta.workloads._subprocess:SubprocessWorkload"
hrx = "aorta.workloads.hrx:HrxWorkload"
hrx_perf = "aorta.workloads.hrx_perf:HrxPerfWorkload"
inference = "aorta.workloads.inference:InferenceWorkload"
llm_determinism = "aorta.workloads.llm_determinism:LlmDeterminismWorkload"
race = "aorta.workloads.race:RaceWorkload"
# Single-process GPU smoke test (no torchrun); ideal for emulated/CI runs.
gpu_smoke = "aorta.workloads.gpu_smoke:GpuSmokeWorkload"
training = "aorta.workloads.training:TrainingWorkload"
# TokenSpeed online-serving benchmark (gfx950/gfx1250). Drives TokenSpeed's own
# `tokenspeed bench serve` in its published container and reports TTFT / TPOT /
# ITL / throughput, which the `mode: probe` route cannot do (no metrics channel).
tokenspeed_serve = "aorta.workloads.tokenspeed_serve:TokenSpeedServeWorkload"

# Side-effect-free isolation metadata. The dispatcher reads these entry-point
# values without importing workload modules, so ``--dry-run`` and ``auto``
# policy resolution cannot trigger torch/native-library imports. Third-party
# process-capable workloads register the same group alongside aorta.workloads.
[project.entry-points."aorta.workload_policies"]
_subprocess = "aorta.run.validation:IN_PROCESS_REQUIRED_POLICY"
llm_determinism = "aorta.run.validation:PROCESS_OPTIONAL_POLICY"
race = "aorta.run.validation:PROCESS_REQUIRED_POLICY"
tokenspeed_serve = "aorta.run.validation:PROCESS_OPTIONAL_POLICY"

[project.entry-points."aorta.workload_startup_env"]
race = "aorta.run.validation:race_startup_env"

# Extension point for `aorta chat`'s agent tools. The entry-point name is the
# tool name and must equal the langchain BaseTool's own `name`, since that is
# what the model is offered and what it asks for. aorta's own tools are NOT
# listed here -- they register directly in `BUILTIN_CHAT_TOOLS`, the same split
# `aorta.mitigations` and `aorta.agents` use -- so this group is declared only
# in a contributing package's pyproject.toml. See docs/chat/extending.md.
#
#   [project.entry-points."aorta.chat_tools"]
#   read_fabric_counters = "my_package.tools:read_fabric_counters"

[project.optional-dependencies]
# For analysis/visualization scripts
analysis = [
    "matplotlib>=3.7.0",
]

# For aorta-report CLI (full functionality)
report = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "beautifulsoup4>=4.12.0",
]

# For hw_queue_eval subpackage
hw-queue = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "tabulate>=0.9.0",
]

# For hw_queue_eval profiling features
hw-queue-profiling = [
    "amd-aorta[hw-queue]",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

# For aorta agent closed-loop (LiteLLM proposer)
agent = [
    "litellm>=1.0.0",
]

# ── aorta chat ────────────────────────────────────────────────────────────
# Split by interface, not by backend: a user knows whether they want a terminal
# or a browser, not whether they want ONNX or torch.
#
# Python range (Decision 13a): chat-cli is 3.11+ because aorta/chat/config.py
# reads the profile file with stdlib ``tomllib``; chat-ui adds a 3.13 ceiling
# because Chainlit declares ``Requires-Python <3.14``. Extras cannot carry their
# own ``requires-python``, so the markers below keep pip from *trying* to
# resolve these on an out-of-range interpreter, and ``aorta/cli/chat.py``
# re-checks ``sys.version_info`` so a silently-empty install still produces a
# sentence rather than an ImportError. (A deliberately-unresolvable sentinel
# dependency would fail louder at install time, but it means putting a
# non-existent distribution name in a public package's metadata, which is a
# name someone else can register.)
chat-cli = [
    "langchain>=0.3.0; python_version >= '3.11'",
    "langchain-openai>=0.2.0; python_version >= '3.11'",
    "langchain-community>=0.3.0; python_version >= '3.11'",
    "langchain-text-splitters>=0.3.0; python_version >= '3.11'",
    "langgraph>=0.2.0; python_version >= '3.11'",
    "openai>=1.50.0; python_version >= '3.11'",
    "pydantic>=2.0; python_version >= '3.11'",
    # >=2.3 is load-bearing: aorta/chat/config.py imports NoDecode, added in 2.3.
    "pydantic-settings>=2.3; python_version >= '3.11'",
    # Vector store (Decision 10b). Replaces chromadb, which hard-required
    # kubernetes, onnxruntime, uvicorn, grpcio and the OpenTelemetry SDK --
    # ~200 MB of server stack to hold a few thousand code-chunk vectors on
    # local disk. 0.1.6 is the floor that ships the ``vec0`` virtual table
    # this code creates; see aorta/chat/rag/sqlite_compat.py.
    "sqlite-vec>=0.1.6; python_version >= '3.11'",
    # Embeddings (Decision 19a). BAAI/bge-small-en-v1.5 on onnxruntime, which is
    # fastembed's own default, so the retrieval quality is BGE's rather than
    # MiniLM's with no torch anywhere. This is what deleted the CUDA-on-AMD
    # hazard: sentence-transformers hard-required torch, and pip resolves the
    # CUDA build by default. Verified against fastembed 0.8.0's metadata rather
    # than its README: it does NOT depend on `onnx`, and beyond what langchain
    # already installs it adds only onnxruntime, pillow, protobuf, flatbuffers,
    # loguru, mmh3 and py-rust-stemmers -- ~30 MB of wheels, ~86 MB installed,
    # against the 2.7 GB the torch path could resolve. 0.4.0 is the floor for
    # the cache_dir argument this code passes.
    "fastembed>=0.4.0; python_version >= '3.11'",
    "rich>=10.0.0; python_version >= '3.11'",
]

# Alias, because `pip install amd-aorta[chat]` is what everyone types first.
chat = [
    "amd-aorta[chat-cli]",
]

# chat-cli plus the Chainlit web UI (`aorta chat ui`).
chat-ui = [
    "amd-aorta[chat-cli]",
    "chainlit>=1.3.0; python_version >= '3.11' and python_version < '3.14'",
]

# For hosts whose Python links sqlite3 older than sqlite-vec's floor (CentOS
# Stream 9 and RHEL 9 ship 3.34.1), or whose build was compiled without
# loadable-extension support. The wheel bundles its own sqlite, so no root is
# needed; aorta/chat/rag/sqlite_compat.py picks it up automatically. A no-op on
# a current distro.
chat-sqlite = [
    "pysqlite3-binary>=0.5.0; python_version >= '3.11'",
]

# Everything optional: the UI plus native Anthropic/Gemini via LiteLLM. There is
# deliberately no torch tier -- Decision 19a removed the sentence-transformers
# path rather than demoting it, because an extra that can put CUDA wheels on a
# ROCm node is a hazard whether or not it is opt-in.
chat-all = [
    "amd-aorta[chat-ui]",
    "litellm>=1.0.0; python_version >= '3.11'",
    # ChatLiteLLM moved here out of langchain-community, which deleted it in 0.4.
    "langchain-litellm>=0.1.0; python_version >= '3.11'",
]

# For aorta.ebpf kernel tracing module.
# The runtime requirements are the bpftrace binary and CAP_BPF/CAP_PERFMON
# (or sudo); no Python deps beyond the base.
ebpf = []

# Test-only tooling (pytest + plugins). Kept separate from `dev` so the CI
# test jobs can install a slim environment without the lint/type tooling.
tests = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-forked>=1.6.0",  # per-test process isolation for the CPU CI gate
    # tests/chat/ awaits the agent graph; pure-python and ~30 KB, so it stays in
    # the slim extra rather than earning one of its own.
    "pytest-asyncio>=0.24.0",
]

# Development dependencies (tests + lint/type tooling)
dev = [
    "amd-aorta[tests]",
    "pre-commit>=3.0.0",
    "black>=25.9.0",  # first release with a py314 formatting target
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

# Full installation.
#
# The chat-* extras are deliberately absent. `all` is what the dev and CI
# stacks install, and that stack is py3.14 (see the classifiers), which is
# outside chat's supported range -- so including them would resolve to nothing
# there while adding ~400 MB anywhere else. Ask for chat explicitly.
all = [
    "amd-aorta[analysis]",
    "amd-aorta[report]",
    "amd-aorta[hw-queue]",
    "amd-aorta[hw-queue-profiling]",
    "amd-aorta[agent]",
    "amd-aorta[dev]",
]

[project.urls]
Homepage = "https://github.com/ROCm/aorta"
Documentation = "https://github.com/ROCm/aorta#readme"
Repository = "https://github.com/ROCm/aorta"

[tool.setuptools_scm]
# Single source of truth for the version: the ``vX.Y.Z`` git tags.
#   * a checkout sitting exactly on a tag builds a clean ``X.Y.Z``;
#   * a checkout ahead of the latest tag builds ``X.Y.(Z+1).devN+g<sha>`` so a
#     local ``pip install .`` / ``pip install git+...`` always reflects the most
#     recent release (plus how far past it the tree is), never a stale literal.
# Only exact ``vMAJOR.MINOR.PATCH`` tags are matched (same shape as
# ``scripts/bump_version.py``), so neither the rolling ``dev-wheels`` nightly tag
# nor a stray ``v1`` / ``v1beta`` / ``v0.2.0rc1`` / ``v1.2.3.4`` tag can be
# mistaken for a release. The ``--match`` glob is only a coarse first pass (glob
# ``*`` also spans dots, so it alone still admits ``v0.2.0rc1`` and
# ``v1.2.3.4``); ``--exclude`` drops any tag carrying a non-digit/non-dot
# character or a fourth numeric segment, and ``tag_regex`` then anchors the
# extracted version to exactly three numeric components with no leading zeros
# (so it round-trips through the integer parsing in ``bump_version.py`` and the
# release gate unchanged). A tree with no git
# metadata (e.g. an unpacked sdist without .git) falls back to the literal below;
# built sdists/wheels embed the resolved version in their metadata, so installing
# from those still reports the correct version.
tag_regex = "^v(?P<version>(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*))$"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v[0-9]*.[0-9]*.[0-9]*",
    "--exclude",
    "v*[!0-9.]*",
    "--exclude",
    "v*.*.*.*",
]
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aorta*"]

[tool.setuptools.package-data]
aorta = [
    "py.typed",
    "chat/ui/chainlit.md",
    # The retrieval eval question set (Decision 19b). Shipped so `aorta chat
    # index eval` works with no arguments on an installed wheel.
    "chat/rag/eval_questions.json",
    "ebpf/scripts/*.bt",
    "ebpf/scripts/PROVENANCE.md",
    "workloads/hrx_kernels/*.cpp",
    "workloads/hrx_kernels/README.md",
    "workloads/tokenspeed/*.sh",
    "workloads/tokenspeed/*.py",
    "workloads/tokenspeed/README.md",
]

# Pytest configuration deliberately does NOT live here -- see `pytest.ini` at
# the repo root. A root `pytest.ini` outranks `[tool.pytest.ini_options]`
# unconditionally, so a block added here would be dead config that pytest
# ignores. Edit `pytest.ini` instead.
# `tests/test_pytest_config_single_source.py` enforces this.

[tool.black]
line-length = 100
# Must list every interpreter in the `Programming Language :: Python` classifiers.
# `py314` is only a valid target from black 25.9.0, hence the `dev` extra's floor.
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
# Vendored verbatim from ROCm/rocm-systems (see the file header); kept in sync
# with upstream rather than reformatted to our style.
force-exclude = 'scripts/sanitizers/download_sanitizer_artifacts\.py'

[tool.isort]
profile = "black"
line_length = 100
extend_skip = ["scripts/sanitizers/download_sanitizer_artifacts.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
# Vendored verbatim from ROCm/rocm-systems (see the file header); kept in sync
# with upstream rather than reformatted to our lints.
extend-exclude = ["scripts/sanitizers/download_sanitizer_artifacts.py"]
