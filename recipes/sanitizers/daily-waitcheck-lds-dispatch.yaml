schema_version: 1
mode: sanitizer
ticket: DAILY-WAITCHECK-LDS-DISPATCH
description: >
  Observed-only (non-gating) gfx950 waitcheck static s_waitcnt wait-count hazard
  scan over a small LDS reduction code object. It is a local control, not a
  Workload survey (Tab 2) row: synthetic controls are not published there, and
  it does NOT gate the nightly.
sanitizer_plan:
  target: gfx950
  source:
    kind: kernel
    kernel:
      name: lds_reduce
      code_object: fixtures/isa/lds.hsaco
      code_object_index: 0
  scope:
    kind: kernel
  selection:
    requirement: top_dispatch_count
    top_n: 1
  sanitizers:
    - waitcheck
  policy:
    consan_policy: strict
    on_missing_backend: fail
  output:
    report: sanitizer_report.json
