# Smoke-test recipe for `aorta sweep run` probe flow (issue #188; #248).
#
# Opaque user launch command:
#
#   aorta sweep run \
#       --recipe recipes/probe/example-probe-smoke.yaml \
#       --output ./probe_results \
#       --ticket PROBE-188 \
#       -- \
#       bash -c 'echo hi; echo PYTORCH_NO_CUDA_MEMORY_CACHING=${PYTORCH_NO_CUDA_MEMORY_CACHING:-unset}'
#
# Verdict comes from the Phase-2 five-tier classifier in
# `aorta.probe.classifier`: a trial fails if any Tier 1-4 detector
# (process exit, hang, dmesg/amd-smi, built-in pattern) fires OR any
# `custom_patterns[*]` entry with `on_match: fail` matches; otherwise
# it passes. Exit code is one input among several -- see
# `docs/probe-188/classifier.md` for the full precedence rules.
# Per-cell stdout and stderr land in
# `<output>/<ticket>/<cell>/trial_<n>/`.
#
# Mitigation / diagnostic names below must resolve in the B3 registry.
# For the full runtime + diagnostic flag sweep see recipes/probe-flag-sweep.yaml
# and examples/probe-flag-sidecar.json (issue #195).
schema_version: 1
mode: probe

ticket: PROBE-188-SMOKE

trials: 2

# This recipe tests the harness, not a mitigation: cell synthesis, env
# stamping and per-cell output. The command above reads nothing, so both cells
# pass; what differs is each cell's stdout, which shows the variable arrived
# (=1) in the second cell and not in the baseline (=unset). Give a real
# workload a built-in it reads.
mitigation_axis:
  - none
  - pytorch_no_cuda_memory_caching

diagnostic_axis:
  - none

# Reserved for a future phase -- both keys are parsed and validated by
# the recipe-builder (so a typo surfaces immediately) but neither is
# consumed by the Phase-2 classifier. `step_time_regex` will feed a
# per-step time analysis in a later phase; `collect_paths` will feed
# `aorta bundle` (#196) in Phase 3. Leave as below for now.
step_time_regex: null
collect_paths: []
timeout_per_trial: 1800

# 'inherit' = stamp mitigations on os.environ in-process; child Popen
# inherits via env=os.environ.copy(). Switch to 'file' for an extra
# chmod-0600 probe.env file + AORTA_ENV_FILE exported into the child.
env_passthrough_mode: inherit
