# HRX perf -- compute-bound SGEMM, HRX-on vs stock-ROCm A/B.
#
# Measures how fast a big tiled SGEMM (C = A*B, N x N floats) runs under the HRX
# HIP-compatibility layer vs the stock ROCm HIP runtime. The `hrx_perf` workload
# builds the bench with hipcc at setup and execs it; each timed iteration is
# measured host-side (launch + hipDeviceSynchronize), so per-step time includes
# runtime/launch overhead -- where HRX can differ from stock HIP.
#
# HOW TO READ THE RESULT
#   The matrix's per-cell "Mean step (ms)" is the mean timed iteration; the
#   Confound column reports hrx_on's step time as a ratio of the hrx_off
#   baseline (e.g. "speed (+8%)" means HRX was 8% slower per iteration).
#   Achieved GFLOP/s is in each trial's result.json metrics (metrics.gflops)
#   and matrix.json.
#
# PREREQUISITES
#   * A ROCm/hipcc toolchain (the workload compiles the bench).
#   * An installed HRX public dist. Replace /path/to/hrx-root in the hrx_on
#     cell below with its prefix (the dir containing lib/libamdhip64.so). Paths
#     under extra_env are passed verbatim (no shell expansion) -- use ABSOLUTE
#     paths. A wrong/placeholder path fails setup instead of silently measuring
#     stock HIP.
#   * On a wheel-layout ROCm install (ROCm 10 / TheRock, where there is no
#     /opt/rocm) two further steps, because this workload builds the bench and
#     then execs it:
#       1. hipcc is looked up as $HIPCC, then /opt/rocm/bin/hipcc, then PATH. A
#          wheel install keeps it at <core>/bin/hipcc and does not put it on
#          PATH, so set `workload_config.hipcc` or $HIPCC. This one is loud --
#          setup fails with a named "hipcc not found" error.
#       2. hipcc output carries neither DT_RPATH nor DT_RUNPATH and these images
#          export no LD_LIBRARY_PATH, so the bench dies before main at exit 127
#          ("libamdhip64.so.N: cannot open shared object file") and surfaces
#          only as a cell that produced no step times -- read `stderr_tail` in
#          the trial's failure_details to see it. Put the ROCm lib dirs on
#          LD_LIBRARY_PATH in the shell that invokes aorta, as CI does (see
#          .github/workflows/gpu-tests.yml):
#            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}$(python -c "import os; from aorta.instrumentation.rocm_paths import resolve_rocm_roots as r; x = r(); print(os.pathsep.join(dict.fromkeys([str(x.core_lib_dir), str(x.lib_dir)])))")"
#          That covers hrx_off only. `extra_env` REPLACES an inherited variable
#          rather than appending to it, so the hrx_on cell's own LD_LIBRARY_PATH
#          must list the ROCm lib dirs too, after the HRX one so HRX still wins.
#
# Run (ticket comes from `ticket:` below; add --strict to fail if a cell errors
# or never runs):
#   aorta sweep run --recipe recipes/hrx-perf-gemm.yaml --output ./triage_results --strict
# Read:
#   cat triage_results/HRX-PERF-GEMM/hrx_perf/*/matrix.md

schema_version: 1

ticket: HRX-PERF-GEMM
workload: hrx_perf

trials: 3
steps: 1

save_logs: true

workload_config:
  bench: gemm
  gpu_arch: gfx942
  size: 4096
  iters: 50
  warmup: 10
  timeout_sec: 600

cells:
  - name: hrx_off
    mitigations: [none]
    environment: local

  - name: hrx_on
    mitigations: [none]
    environment: local
    # EDIT: replace /path/to/hrx-root with your installed HRX prefix.
    extra_env:
      HRX_GPU_DRIVER: "amdgpu"
      LD_LIBRARY_PATH: "/path/to/hrx-root/lib"
      LD_PRELOAD: "/path/to/hrx-root/lib/libamdhip64.so"
