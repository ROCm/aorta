# HRX HIP-launch probe -- HRX-on vs stock-ROCm A/B smoke recipe.
#
# Exercises one HRX HIP kernel-launch path (issue #273) and compares the HRX
# HIP-compatibility layer against the stock ROCm HIP runtime. The `hrx`
# workload builds the probe from vendored source with hipcc at setup and execs
# it as a child process; each cell's `extra_env` decides which libamdhip64 that
# child loads:
#
#   hrx_off : stock ROCm HIP (no routing) -- the baseline.
#   hrx_on  : HRX's libamdhip64.so LD_PRELOADed at exec().
#
# A green run shows hrx_on matching hrx_off with verdict FULLY_WORKS (out[0]=107);
# the #156 bug shows up as hrx_on -> OUTPUT_NOT_WRITTEN (out[0]=0) while hrx_off
# stays FULLY_WORKS.
#
# PREREQUISITES
#   * A ROCm/hipcc toolchain (the workload compiles the probe).
#   * An installed HRX public dist. Set HRX_ROOT below to its prefix (the dir
#     that contains lib/libamdhip64.so). The paths under `extra_env` must be
#     ABSOLUTE -- extra_env values are passed verbatim (no shell expansion), so
#     edit the placeholder before running.
#   * On a wheel-layout ROCm install (ROCm 10 / TheRock, where there is no
#     /opt/rocm) two further steps, because this workload builds a binary and
#     then execs it:
#       1. hipcc is looked up as $HIPCC, then /opt/rocm/bin/hipcc, then PATH. A
#          wheel install keeps it at <core>/bin/hipcc and does not put it on
#          PATH, so set `workload_config.hipcc` or $HIPCC. This one is loud --
#          setup fails with a named "hipcc not found" error.
#       2. hipcc output carries neither DT_RPATH nor DT_RUNPATH and these images
#          export no LD_LIBRARY_PATH, so the probe dies before main at exit 127
#          ("libamdhip64.so.N: cannot open shared object file") and surfaces
#          only as a cell with no VERDICT line -- read `stderr_tail` in the
#          trial's failure_details to see it. Put the ROCm lib dirs on
#          LD_LIBRARY_PATH in the shell that invokes aorta, as CI does (see
#          .github/workflows/gpu-tests.yml):
#            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}$(python -c "import os; from aorta.instrumentation.rocm_paths import resolve_rocm_roots as r; x = r(); print(os.pathsep.join(dict.fromkeys([str(x.core_lib_dir), str(x.lib_dir)])))")"
#          That covers hrx_off only. `extra_env` REPLACES an inherited variable
#          rather than appending to it, so the hrx_on cell's own LD_LIBRARY_PATH
#          must list the ROCm lib dirs too, after the HRX one so HRX still wins.
#
# Run (the ticket comes from `ticket:` below -- do NOT also pass --ticket, it
# conflicts with --recipe):
#   aorta sweep run --recipe recipes/hrx-launch-probe-smoke.yaml --output ./triage_results
# Read:
#   cat triage_results/HRX-273-SMOKE/hrx/*/matrix.md

schema_version: 1

ticket: HRX-273-SMOKE
workload: hrx

trials: 1
steps: 1

save_logs: true

workload_config:
  # One of: static | module | graph_add | graph_setparams | graph_execsetparams
  probe: module
  gpu_arch: gfx942
  timeout_sec: 120

cells:
  - name: hrx_off
    mitigations: [none]
    environment: local

  - name: hrx_on
    mitigations: [none]
    environment: local
    # EDIT: replace /path/to/hrx-root with your installed HRX prefix.
    extra_env:
      HRX_GPU_DRIVER: "amdgpu"
      LD_LIBRARY_PATH: "/path/to/hrx-root/lib"
      LD_PRELOAD: "/path/to/hrx-root/lib/libamdhip64.so"
