# Rollout-shaped serving load: several sampled completions per prompt, stopping
# on EOS.
#
# This is the load an RL post-training loop puts on an inference engine during
# its generation phase, which is where such a loop spends most of its wall
# clock. It differs from the other tokenspeed-serve recipes in what the engine
# is asked to do rather than in how hard it is pushed: `rollout: true` sends
# `n` sampled completions per prompt at a temperature above zero and lets the
# model stop where it wants, so the number of tokens generated is a property of
# the policy instead of a number this file chose.
#
#   aorta sweep run --recipe recipes/tokenspeed/tokenspeed-serve-rollout.yaml \
#     --output-dir /tmp/ts-serve-rollout
#
# Reading the result: `output_throughput` and `total_token_throughput` in
# `perf.md` are what bound a rollout iteration's duration, and the
# `generated_tokens_p50` / `_p90` / `_p99` / `_max` columns are what size the KV
# cache and set how long the slowest completion holds a batch open.
# `mean_output_tokens_per_request` is the same quantity read from the always-
# present counters, so it is the one to trust if the two disagree.
#
# The confound ratio in `matrix.md` is not meaningful here. Cells differ by
# sample count and prompt shape, so they legitimately do different amounts of
# work -- read `perf.md`.
#
# ===========================================================================
# READ THIS BEFORE QUOTING ANYTHING FROM `samples-4` OR `samples-8`.
#
# These cells do NOT compare sample counts. TokenSpeed returns identical
# choices for `n > 1` within a single request, so a cell asking for four or
# eight samples per prompt gets one distinct completion repeated four or eight
# times. What varies across `samples-1`, `samples-4` and `samples-8` is the
# batching and scheduling overhead of carrying that many copies -- which is a
# real serving measurement, and is not the thing the cell names describe.
#
# So: throughput, concurrency behaviour, KV-cache occupancy and the
# per-completion cost of a larger group are all still measured here. Anything
# that depends on the completions actually differing -- sampling diversity,
# group variance, anything a GRPO advantage would be computed over -- is not.
#
# ⚠ This is NOT the greedy-default defect this recipe's PR fixes, and the two
# must not be conflated. That one was the engine defaulting `--sampling-backend`
# to `greedy` off NVIDIA and silently discarding `temperature`, `top_p`, `top_k`
# and `seed`; it is fixed, the backend is now pinned to `triton`, and the
# workload reads it back off `/get_server_info` -- failing with exit 57
# (`rollout_sampling_ignored`) if the engine reports `greedy`, or exit 58
# (`rollout_sampling_backend_mismatch`) if it reports some other backend than
# was asked for. The `n > 1` collapse is a separate upstream defect that
# SURVIVES that fix -- it reproduces at every temperature with sampling working.
# A future reader should not assume the sampling-backend fix resolved it,
# because it does not. Separate requests are unaffected, which is why the RL
# driver on the stacked branch issues one request per sample rather than one
# batched request per group; for that driver this costs throughput rather than
# correctness. Recorded in `docs/tokenspeed-serving.md` and, with the measurement
# behind it, in `docs/tokenspeed-rl-e2e-sanitizer-routing.md` on the follow-up.
#
# Kept rather than removed because the cells do exercise the serving path and
# the defect is upstream, not ours. Renaming them would hide a real engine
# limitation behind a tidier recipe.
# ===========================================================================
#
# Two more things to know before reading the numbers.
#
# On `dataset: random` the length distribution is not a property of the model.
# The prompts are random tokens, so nothing induces an end-of-sequence token and
# every completion runs to `output_len`; `generated_tokens_*` will read as a
# constant at the cap. Throughput and the concurrency behaviour are still valid
# -- those depend on the request shape rather than on where generation stops.
# A distribution that means something needs prompts a model would answer.
#
# The `samples-1` cell is a control, and it is the cell that still does its job
# in full. The bench derives a request's output length from the response's
# `usage.completion_tokens`, which was measured on gfx950 to sum across all `n`
# choices -- so the throughput figures here cover the whole rollout rather than
# one sample of it. That summing is real whether or not the choices differ, so
# comparing `mean_output_tokens_per_request` between this cell and `samples-4`
# still keeps it observable if the gateway's behaviour changes, and still gives
# the per-completion cost of carrying a larger group. What that comparison does
# not give is anything about sampling, per the block above.
schema_version: 1
ticket: TOKENSPEED-SERVE-ROLLOUT
workload: tokenspeed_serve
trials: 1
steps: 3

workload_config:
  # Digest, not the :nightly-20260714 tag it came from: a moving tag would let
  # the image change underneath a blessed baseline while the recipe still read
  # as pinned.
  image: lightseekorg/tokenspeed-amd@sha256:60c12e37c01496891053b9c30c4204e5d1cf9b4b641859d3aadcbd95bccc7c78
  # Qwen3-class, as named in the requirement, and the smallest of them: the
  # point of this recipe is the load shape, and the shape is legible fastest on
  # a model that loads in minutes rather than tens of them. Swap in a larger
  # Qwen3 once the shape is trusted.
  model: Qwen/Qwen3-0.6B

  rollout: true
  # 1.0 is the sampling temperature a GRPO-style rollout ordinarily draws at:
  # the group of completions per prompt has to actually differ, or the advantage
  # within the group is zero and the update carries no signal.
  temperature: 1.0
  top_p: 0.95

  # Prompt shape. Short prompt, long allowance: a rollout's prompt is a task
  # description and its completion is the work, which is the opposite of the
  # prefill-heavy shape `tokenspeed-serve-load.yaml` measures.
  input_len: 512
  # An allowance, not a length. With EOS respected this is the `max_tokens` cap;
  # the reported `generated_tokens_*` distribution is what the policy did with
  # it, and a p99 sitting at this value means the cap is what truncated the
  # rollout rather than the model.
  output_len: 1024

  # Concurrency 32 rather than the unbounded default. A rollout submits its
  # whole batch of prompts at once and is bounded by aggregate throughput, so
  # some cap is what keeps the engine in the regime the measurement is about --
  # and 32 is on the part of the curve `tokenspeed-serve-load.yaml` measured as
  # still returning throughput per unit of cap.
  max_concurrency: 32

  num_warmups: 1
  warmup_steps: 1
  seed: 0
  work_dir: /tmp/ts-work-serve
  # A rollout step generates far more tokens than a fixed 128-token benchmark
  # step, so the per-step deadline has to cover it: 32 prompts x 4 samples x up
  # to 1024 tokens is a different amount of decode from anything the other
  # recipes ask for.
  bench_timeout_sec: 3600
  ready_timeout_sec: 1200

cells:
  # The control described in the header. Same prompts, same temperature, one
  # completion each -- so the only difference from `samples-4` is `n`.
  - name: samples-1
    mitigations: [none]
    environment: local
    workload_config:
      rollout_samples: 1
      num_prompts: 32

  # The rollout request shape: four completions per prompt, which is the
  # smallest group size a GRPO-style advantage would be computed over.
  #
  # ⚠ "Would be", not "is". Per the block at the top of this file, the four
  # completions come back identical, so there is no group variance here and no
  # advantage could be computed from this cell. What it measures against
  # `samples-1` is the cost of carrying four copies through the scheduler.
  - name: samples-4
    mitigations: [none]
    environment: local
    workload_config:
      rollout_samples: 4
      num_prompts: 32

  # Eight completions over half the prompts: the same number of completions as
  # `samples-4`, reached with a larger group over fewer prompts. Which of the
  # two costs less per completion is a scheduling question -- more completions
  # per prompt share a prefill, more prompts do not -- and this is the pair that
  # answers it.
  #
  # This pairing survives the `n > 1` defect intact, and it is the reason these
  # cells are worth keeping: prefill sharing and scheduler cost do not depend on
  # the completions differing from one another. Read it as a batching
  # comparison, not a sample-count one.
  - name: samples-8
    mitigations: [none]
    environment: local
    workload_config:
      rollout_samples: 8
      num_prompts: 16

  # Long-form generation, which is what a reasoning-style rollout produces. The
  # 4096-token allowance is where the tail of the length distribution starts to
  # matter to the KV cache rather than being absorbed by it.
  #
  # The tail this reports is a tail across prompts, not across samples: the four
  # completions of any one prompt are the same length because they are the same
  # completion. On `dataset: random` they would all sit at the cap in any case.
  - name: long-form
    mitigations: [none]
    environment: local
    workload_config:
      rollout_samples: 4
      num_prompts: 16
      input_len: 256
      output_len: 4096
