# TokenSpeed serving: gpt-oss-20b on gfx950.
#
# gpt-oss-20b is TokenSpeed's canonical AMD benchmark model, and until this
# recipe existed every serving number in the repo came from Qwen3-0.6B -- a
# model small enough that a single MI355 barely notices it. The interesting
# question is not whether the workload can drive a larger model (it has no
# size-specific logic) but whether the *numbers* stay meaningful at a size where
# MoE routing, MXFP4 dequantisation and KV-cache pressure actually matter.
#
# TokenSpeed supports the architecture first-class: `runtime/models/gpt_oss.py`
# with a dedicated `_load_mxfp4_weights` path for the packed MoE experts. The
# repo is ungated and needs no HF token, unlike most models this size.
#
# Cost. The model takes appreciably longer to load than Qwen3-0.6B, so
# `ready_timeout_sec` is raised well above the default. On a cold HF cache the
# first trial spends minutes downloading before it serves anything; pre-warm
# with
#
#   HF_HOME=/tmp/ts-work-serve/u$(id -u)/hf hf download openai/gpt-oss-20b
#
# or expect the first cell to look slow for a reason that has nothing to do with
# the engine. Three things about that command are load-bearing:
#
#   - The `u$(id -u)` component. The cache defaults to `<work_dir>/u<uid>/hf`, so
#     a download into `<work_dir>/hf` populates a directory the run does not
#     mount and the first cell downloads the 40 GB again anyway.
#
#   - The FULL snapshot, ~40 GB. `--exclude "original/*"` looks like an obvious
#     saving and produces a cache that downloads fine and then fails during
#     weight loading.
#
#   - Run it as the uid the trial runs as. `run_as_current_user` defaults to
#     true, so a cache populated by a root container leaves the run failing with
#     PermissionError on the snapshot directory.
#
# All three are written up in docs/tokenspeed-serving.md under "Measured:
# gpt-oss-20b".
#
# Single-GPU deliberately: MXFP4 puts the 21B parameters inside one MI355's
# memory, so this recipe isolates model *size* as the variable. Tensor
# parallelism is a separate axis and is covered by
# tokenspeed-serve-gptoss-tp.yaml.

schema_version: 1
ticket: TOKENSPEED-SERVE-GPTOSS
workload: tokenspeed_serve
trials: 1

# Three steps for the same reason as the smoke recipe: variance. Measured steps
# all run against one already-started server, after the default whole-step
# warmup, so none of them includes model loading -- startup is measured
# separately and reported as server_startup_sec. What a single step cannot give
# is any sense of spread, and it matters more at this size, where MoE routing
# and KV-cache pressure make step-to-step variation larger than on Qwen3-0.6B.
steps: 3

workload_config:
  image: lightseekorg/tokenspeed-amd@sha256:60c12e37c01496891053b9c30c4204e5d1cf9b4b641859d3aadcbd95bccc7c78
  model: openai/gpt-oss-20b
  num_prompts: 32
  input_len: 512
  output_len: 128
  max_concurrency: 8
  num_warmups: 1
  ignore_eos: true
  seed: 0
  work_dir: /tmp/ts-work-serve
  # 30 min, not the 900s default: this covers a cold-cache download plus MXFP4
  # weight loading and the Gluon JIT. A tight value here fails as a readiness
  # timeout, which reads as a broken engine rather than as a slow first load.
  ready_timeout_sec: 1800

cells:
  - name: baseline
    mitigations: [none]
    environment: local

  - name: no-scratch-reclaim
    mitigations: [hsa_no_scratch_reclaim]
    environment: local
