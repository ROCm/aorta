# TokenSpeed serving: tensor parallelism on gfx950.
#
# Everything else in this directory serves on one GPU. That leaves the whole
# multi-GPU path -- the one where RCCL is on the critical path and where most
# real serving deployments live -- untested, and it is the axis where mitigations
# stop being a formality: a collective that stalls or falls back to a slower
# algorithm shows up as latency, not as a failure.
#
# TP is the axis, not the mitigation. Each cell serves the same model at a
# different `--tensor-parallel-size`, so the matrix answers two questions at
# once: does it work at all above 1, and does the scaling look like anything
# sane. Bad TP scaling is a real finding; a broken collective is a different and
# louder one.
#
# Why gpt-oss-20b rather than Qwen3-0.6B: at 0.6B the model fits so comfortably
# in one MI355 that TP measures overhead and nothing else, and the numbers would
# get worse with every GPU added for reasons that say nothing about the stack.
# At 21B the per-GPU KV-cache headroom actually changes with TP.
#
# Requires >= 2 visible GPUs, and each cell pins exactly the ones it needs.
# Pinning is not cosmetic here: it is what makes each cell's GPU set known, and
# the workload only attributes unreleased VRAM after teardown to a trial that
# had an exclusive assignment. Left unset, the engine picks for itself and a
# co-tenant's allocation is indistinguishable from this trial's leftovers, so
# the leak check downgrades to an unattributed warning -- on the one recipe
# where slow release was actually observed. See "A tensor-parallel teardown
# returns before the GPUs are actually free" in docs/tokenspeed-serving.md.
#
# TP=4 is NOT here, and its absence is a finding rather than an oversight. It
# fails to come up on this image, reproducibly, with an out-of-memory raised
# while `FlatMemoryExecutor` builds its host-side KV mirror:
#
#   flat_host_mirror.py:127, in __init__
#     torch.zeros(...)
#   torch.AcceleratorError: CUDA error: out of memory
#
# Ruled out: contamination from an earlier cell (the GPUs were reset clean
# immediately beforehand). The node has 3 TB of host RAM and eight 309 GB cards,
# so it is short of neither.
#
# NOT ruled out: container shared memory. The `shm_size: 16g` vs `256g` runs
# that appeared to rule it out predate the removal of `--ipc host`, under which
# docker ignored `--shm-size` and both runs shared the host's /dev/shm -- so
# they compared one mount with itself. Worth re-running before diagnosis goes
# anywhere else; see docs/tokenspeed-serving.md.
#
# Adding the cell back would also leave the node
# needing `rocm-smi --gpureset` after every sweep, because ranks that die this
# way hold their memory for longer than the workload is willing to wait -- see
# "A tensor-parallel teardown returns before the GPUs are actually free" in
# docs/tokenspeed-serving.md.

schema_version: 1
ticket: TOKENSPEED-SERVE-GPTOSS-TP
workload: tokenspeed_serve
trials: 1

steps: 3

workload_config:
  image: lightseekorg/tokenspeed-amd@sha256:60c12e37c01496891053b9c30c4204e5d1cf9b4b641859d3aadcbd95bccc7c78
  model: openai/gpt-oss-20b
  num_prompts: 32
  input_len: 512
  output_len: 128
  max_concurrency: 8
  num_warmups: 1
  ignore_eos: true
  seed: 0
  work_dir: /tmp/ts-work-serve
  # Higher than the single-GPU recipe: TP adds collective initialisation to
  # startup, and on a cold Gluon cache each rank JITs its own kernels.
  ready_timeout_sec: 2400

cells:
  # TP=1 is the control, not a formality: without it a regression in the
  # multi-GPU path cannot be told apart from a regression in the model or the
  # image, since there would be nothing on this node to compare against.
  - name: tp1
    mitigations: [none]
    environment: local
    workload_config:
      hip_visible_devices: "0"
      serve_args: ["--tensor-parallel-size", "1"]

  - name: tp2
    mitigations: [none]
    environment: local
    workload_config:
      hip_visible_devices: "0,1"
      serve_args: ["--tensor-parallel-size", "2"]
