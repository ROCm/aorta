# One-rank smoke for the tiny transformer.
# Usage: docs/tiny-transformer.md
#
# `tiny_transformer` delegates to the `training` loop. `launcher: inprocess`
# runs that loop in this process (world size 1, gloo on CPU). It does not
# start Monarch, Spur, or a GPU job. There is no `expected_world_size`.
#
#   # validate only (no GPUs / no launcher needed):
#   aorta sweep run --recipe recipes/training/tiny-transformer.yaml --dry-run
#
#   # CPU or single-GPU smoke:
#   aorta sweep run --recipe recipes/training/tiny-transformer.yaml
#
# Pass line: passed: true, one loss, world size 1.
schema_version: 1
ticket: TINY-TRANSFORMER
workload: tiny_transformer
trials: 1
steps: 20

workload_config:
  launcher: inprocess
  parallelism: ddp
  seed: 1234
  device: auto             # auto|cuda|cpu
  dtype: float32           # float32 keeps the cross-rank loss check stable
  batch_size: 2
  seq_len: 32
  warmup_steps: 0

  model:
    kind: transformer
    hidden_size: 256
    num_layers: 4
    num_heads: 4
    ffn_size: 512
    vocab_size: 256

  optimizer:
    kind: adamw
    lr: 0.0003
    weight_decay: 0.01

  checks:
    fail_on_nan_loss: true
    fail_on_nan_grad: true
    fail_on_nonfinite_output: true
    fail_on_rank_loss_mismatch: true

cells:
  - name: baseline-local
    mitigations: [none]
    environment: local
