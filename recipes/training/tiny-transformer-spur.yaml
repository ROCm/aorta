# Two-node, 16-GPU tiny transformer launched by Spur.
# Usage: docs/tiny-transformer.md
#
# Same model and checks as recipes/training/tiny-transformer.yaml.
# `launcher: spur` runs one `spur srun -N 2 --ntasks-per-node 8` of the
# resolved training config. It does not replay this command. Workers map
# `SLURM_PROCID` to `RANK`. `MASTER_ADDR` is rank 0's IPv4: set
# `AORTA_RANK0_IP`, or the controller probes it. Set `AORTA_MASTER_PORT` to
# a free TCP port; the controller does not guess one. Set `AORTA_SHARED_DIR`
# to a directory every node can read and write (not node-local `/tmp`);
# rank 0 writes `rank0.json` there. If `spur` is not on PATH, set
# `workload_config.spur_bin` to that binary (default `spur`).
# This recipe does not submit a Slurm job.
#
#   # validate only (does not spawn):
#   aorta triage run --recipe recipes/training/tiny-transformer-spur.yaml --dry-run
#
#   # from the controller node, Spur already up:
#   aorta triage run --recipe recipes/training/tiny-transformer-spur.yaml
#
# Pass line: passed: true, one loss, world size 16.
schema_version: 1
ticket: TINY-TRANSFORMER-SPUR
workload: tiny_transformer
trials: 1
steps: 20

workload_config:
  launcher: spur
  nodes: 2
  gpus_per_node: 8
  expected_world_size: 16
  spur_bin: spur
  parallelism: ddp
  seed: 1234
  device: auto
  dtype: float32
  batch_size: 8
  seq_len: 128
  warmup_steps: 0

  model:
    kind: transformer
    hidden_size: 256
    num_layers: 4
    num_heads: 4
    ffn_size: 512
    vocab_size: 256

  optimizer:
    kind: adamw
    lr: 0.0003
    weight_decay: 0.01

  checks:
    fail_on_nan_loss: true
    fail_on_nan_grad: true
    fail_on_nonfinite_output: true
    fail_on_rank_loss_mismatch: true

cells:
  - name: baseline-local
    mitigations: [none]
    environment: local
