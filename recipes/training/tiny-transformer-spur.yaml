# Two-node, 16-GPU tiny transformer launched by Spur.
#
# Same model and checks as recipes/training/tiny-transformer.yaml.
# `launcher: spur` runs `spur srun -N 2 --ntasks-per-node 8`, which re-execs
# this aorta command with `AORTA_INNER=1`. Workers map `SLURM_PROCID` to
# `RANK` and set `MASTER_ADDR` to the controller IPv4. Spur is not on PATH
# on this cluster: set `workload_config.spur_bin` to the overlay binary
# (default `spur`). This recipe does not submit a Slurm job.
#
#   # validate only (does not spawn):
#   aorta triage run --recipe recipes/training/tiny-transformer-spur.yaml --dry-run
#
#   # from the controller node, Spur already up:
#   aorta triage run --recipe recipes/training/tiny-transformer-spur.yaml
#
# Pass line: passed: true, one loss, world size 16.
schema_version: 1
ticket: TINY-TRANSFORMER-SPUR
workload: tiny_transformer
trials: 1
steps: 20

workload_config:
  launcher: spur
  nodes: 2
  gpus_per_node: 8
  expected_world_size: 16
  spur_bin: spur
  parallelism: ddp
  seed: 1234
  device: auto
  dtype: float32
  batch_size: 8
  seq_len: 128
  warmup_steps: 0

  model:
    kind: transformer
    hidden_size: 256
    num_layers: 4
    num_heads: 4
    ffn_size: 512
    vocab_size: 256

  optimizer:
    kind: adamw
    lr: 0.0003
    weight_decay: 0.01

  checks:
    fail_on_nan_loss: true
    fail_on_nan_grad: true
    fail_on_nonfinite_output: true
    fail_on_rank_loss_mismatch: true

cells:
  - name: baseline-local
    mitigations: [none]
    environment: local
