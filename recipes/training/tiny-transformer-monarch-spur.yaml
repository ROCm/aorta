# Two-node, 16-GPU tiny transformer launched by Monarch on a Spur allocation.
# Usage: docs/tiny-transformer.md
#
# Same model and checks as recipes/training/tiny-transformer-monarch.yaml.
# `scheduler: spur` starts the Monarch workers as `spur srun` steps of the
# Spur allocation this shell is in. Run aorta from the shell that
# `spur salloc -N2 --gpus-per-node=8 --exclusive` opens, so SPUR_JOB_ID is
# set. This recipe does not request the allocation. If `spur` is not on PATH,
# set `spur_bin` to that binary.
#
#   # validate only (does not spawn):
#   aorta triage run --recipe recipes/training/tiny-transformer-monarch-spur.yaml --dry-run
#
#   # inside the Spur allocation shell:
#   aorta triage run --recipe recipes/training/tiny-transformer-monarch-spur.yaml
#
# Pass line: passed: true, one loss, world size 16.
schema_version: 1
ticket: TINY-TRANSFORMER-MONARCH-SPUR
workload: tiny_transformer
trials: 1
steps: 20

workload_config:
  launcher: monarch
  scheduler: spur
  spur_bin: spur
  nodes: 2
  gpus_per_node: 8
  expected_world_size: 16
  parallelism: ddp
  seed: 1234
  device: auto
  dtype: float32
  batch_size: 8
  seq_len: 128
  warmup_steps: 0

  model:
    kind: transformer
    hidden_size: 256
    num_layers: 4
    num_heads: 4
    ffn_size: 512
    vocab_size: 256

  optimizer:
    kind: adamw
    lr: 0.0003
    weight_decay: 0.01

  checks:
    fail_on_nan_loss: true
    fail_on_nan_grad: true
    fail_on_nonfinite_output: true
    fail_on_rank_loss_mismatch: true

cells:
  - name: baseline-local
    mitigations: [none]
    environment: local
