schema_version: 1
mode: sanitizer
ticket: DAILY-FPSAN-MISMATCH
description: >
  Daily gfx950 Triton FpSan guardrail on a row-dot candidate that drops its
  accumulate, against the correct reference (expect FAIL with
  fpsan_digest_mismatch). fixtures/fpsan/fpsan_pair.py holds both sides.

sanitizer_plan:
  target: gfx950
  source:
    kind: kernel
    kernel:
      name: row_dot_no_accumulate
    fpsan_command: fixtures/fpsan/fpsan_mismatch.py
  scope:
    kind: kernel
  selection:
    requirement: top_dispatch_count
    top_n: 1
  sanitizers:
    - fpsan
  policy:
    consan_policy: strict
    on_missing_backend: fail
  output:
    report: sanitizer_report.json
