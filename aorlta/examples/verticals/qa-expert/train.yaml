# Train on the qa-expert starter's 4 placeholder questions, 8 samples each, 3 iterations: a template to
# copy with your own pool, far too small to learn from.
# One GPU: one TokenSpeed engine on GPU 0 and one LoRA rank beside it; the answer check runs on the CPU.
# Site-specific paths, to edit here or to set in a site file (AORLTA_SITE): run.root, model.base_dir and
# data.prompt_pools[0].path, which is this checkout's aorlta/examples/verticals/qa-expert/pool/train.
plugins: [examples/verticals/qa-expert/qa_expert.py]
run:
  run_id: qa-expert-train
  source: standin
  root: /scratch/aorlta/runs
model:
  base_dir: /data/hf/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  source: standin
data:
  prompt_pools:
    - path: /opt/aorlta/examples/verticals/qa-expert/pool/train
      source: standin
      task: qa-expert
rollout:
  engines: [0]
  K: 8
  P: 4
  max_repair_turns: 1
  thinking: "off"
  temperature: 1.0
  max_new_tokens: 512
  compile_adapter: none
  parse_adapter: qa-expert.parse
  feedback_template: qa-expert.feedback
  # few prompts, each with a short answer, can give a group K identical replies with a sound sampler
  # (the engines' start-up self-test checks that), so only stop when most groups do
  identical_groups_stop: 0.75
reward:
  profile: qa-expert
  reward_fn: qa-expert.v1
orchestrator:
  iterations: 3
  run_seed: 20261113
trainer:
  ranks: 1
  micro_batch_tokens: 20480
  lr: 2.0e-5
