# `hipk-gpu`: the example task's checks (examples/hip-kernels/hip_kernels.py). The stand-in parse and compile gates,
# then `ref.native`: the candidate built with its task's harness and run on one of the GPUs in `hipk.run.gpus`, its
# outputs compared with a host reference. Scored by hipk.v1.
name: hipk-gpu
reward_fn: hipk.v1
clean_repeats: 1
materialize: true
pools:
  gates: {resource: local_cpu, adapter: standin.parse, timeout: gate, workers: 4}
  compile: {resource: local_cpu, adapter: standin.hipcc, timeout: compile, workers: 8}
  run: {resource: own_gpu, adapter: hipk.run, timeout: sim_run, workers: 4}
stages:
  - {name: S0, pool: gates, legs: [gate.parse]}
  - {name: S1, pool: compile, legs: [gate.compile]}
  - {name: S2, pool: run, legs: [ref.native]}
requires:
  gate.compile: [gate.parse]
  ref.native: [gate.compile]
leg_settings:
  gate.compile: {offload_arch: gfx950, flags: ["-c", "-O1"]}
  ref.native: {target: gfx950, run_timeout_s: 20}
# `${AORLTA_ROCM_ROOT}` is that environment variable, or /opt/rocm. Worker n of the run pool uses
# gpus[(n - 1) % len(gpus)]: keep these off the engines' GPUs (rollout.engines).
adapters:
  standin.hipcc: {hipcc: "${AORLTA_ROCM_ROOT}/bin/hipcc", readelf: "${AORLTA_ROCM_ROOT}/llvm/bin/llvm-readelf"}
  hipk.run: {hipcc: "${AORLTA_ROCM_ROOT}/bin/hipcc", gpus: [4, 5, 6, 7]}
