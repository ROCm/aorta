# Nightly evaluation matrix -- one entry per (workload x config) the nightly
# eval runs against the released wheel. Each entry runs a recipe via
# `aorta sweep run --strict` (under torchrun when `nproc` is set), then the
# harness (scripts/ci/nightly_eval.py) harvests matrix.json and compares each
# cell against config/ci/regression_baselines.yaml.
#
# Fields:
#   name      - stable id for this entry (used as the baseline key prefix + in results)
#   recipe    - recipe path (relative to repo root)
#   nproc     - optional; launch under `torchrun --standalone --nproc_per_node=<n>`
#   min_gpus  - optional; skip when torch.cuda.device_count() is lower (default 1;
#               defaults to nproc when nproc is set)
#   timeout_sec - optional; per-entry wall-clock budget (default 1800). Exceeding
#               it kills the whole process group and FAILS the entry.
#
# Record-only is NOT a field here: a cell is record-only exactly while
# config/ci/regression_baselines.yaml has no key for it. Adding an entry to
# `entries` therefore starts it record-only by construction. Note the limit of
# that -- record-only defers PERFORMANCE gating only. A cell that errors or
# fails is a `fail` with or without a baseline (nightly_eval.py is fail-closed),
# so an entry may only be added here once it can actually pass on the runner.
#
# Phase 1 wires one config per registered workload (the smoke recipes). Per-workload
# matrices (dtypes, larger GPU counts) are Phase 3 -- add rows here, no code change.
version: 1

entries:
  - name: gpu_smoke
    recipe: recipes/ci/gpu-smoke.yaml

  - name: inference_offline
    recipe: recipes/inference/example-inference-smoke.yaml

  # NOTE: inference (continuous_batch) is intentionally NOT wired yet. The
  # `recipes/inference/example-inference-continuous-smoke.yaml` smoke currently
  # FAILS on the MI350 runner ("1 failed of 1 trial") while the offline smoke
  # passes -- a genuine continuous-batch workload/recipe issue to fix separately.
  # Re-add this entry once that smoke passes on hardware. (The nightly eval
  # correctly caught this via fail-closed; it's excluded here only so the broken
  # workload doesn't block unrelated stack-bump / CI PRs.)

  # NOTE: HRX recipes are intentionally NOT wired here. The shipped
  # recipes/hrx/*.yaml use literal `/path/to/hrx-root` preload paths and build
  # for gfx942, and the CI container provisions no HRX runtime -- so on the
  # gfx950 runner they cannot pass or produce a blessable baseline. Re-add HRX
  # once dedicated gfx950 CI recipes + an HRX runtime at a stable path exist
  # (e.g. recipes/ci/hrx-*-gfx950.yaml).

  - name: training_ddp
    recipe: recipes/training/example-training-ddp-smoke.yaml
    nproc: 2
    min_gpus: 2

  - name: training_fsdp
    recipe: recipes/training/example-training-fsdp-smoke.yaml
    nproc: 2
    min_gpus: 2

  - name: race
    recipe: recipes/race/race_smoke.yaml
    nproc: 2
    min_gpus: 2

  - name: llm_determinism
    recipe: recipes/llm-determinism/example-llm-determinism.yaml
    nproc: 2
    min_gpus: 2

  # GPU-count axis: full-node (8-GPU) variants of the distributed workloads.
  # Skipped automatically when fewer than 8 GPUs are visible.
  - name: training_ddp_8gpu
    recipe: recipes/training/example-training-ddp-smoke.yaml
    nproc: 8
    min_gpus: 8

  - name: training_fsdp_8gpu
    recipe: recipes/training/example-training-fsdp-smoke.yaml
    nproc: 8
    min_gpus: 8

  - name: race_8gpu
    recipe: recipes/race/race_smoke.yaml
    nproc: 8
    min_gpus: 8

  - name: llm_determinism_8gpu
    recipe: recipes/llm-determinism/example-llm-determinism.yaml
    nproc: 8
    min_gpus: 8

# Entries that are ready to run but blocked on a runner prerequisite. This key
# is not read by anything: nightly_eval.py and refresh_baselines.py both iterate
# `entries` only, so nothing below executes. It exists because the alternative
# for a staged-but-blocked entry is a commented-out block (the convention the
# two NOTEs above use), and a comment cannot be checked -- tests/ci/
# test_nightly_eval.py validates these the same way it validates `entries`, so
# the recipe path, the GPU requirement and the metric names are known-good on
# the day the prerequisite lands rather than discovered by a red nightly.
#
# Promote by moving the entry (minus `blocked_on`) into `entries` above.
pending_entries:
  # TokenSpeed online serving. Chosen over the other four serving recipes as the
  # cheapest cell that still answers something: Qwen3-0.6B is ~1.2 GB of weights
  # against ~40 GB for the gpt-oss recipes, and two cells against four (models)
  # or six (load). It is also the only serving recipe whose cells differ ONLY by
  # mitigation, so the pair is a same-night control: a move in both cells is the
  # stack, a move in one is the mitigation or noise. That is the triage lever the
  # multi-model and load recipes cannot give, since their cells legitimately
  # differ in speed.
  #
  # 3600s, not the 1800s default: two bring-ups at the observed startup spread
  # (189-379 s, see docs/tokenspeed.md) plus the teardown VRAM drain is ~15 min
  # before the container image pull and any cold-cache weight download, and a
  # timeout is an unconditional entry FAILURE rather than a slow record.
  - name: tokenspeed_serve_smoke
    recipe: recipes/tokenspeed/tokenspeed-serve-bench-smoke.yaml
    min_gpus: 1
    timeout_sec: 3600
    # The nightly runs `nightly_eval.py` INSIDE the aorta-ci-gpu container
    # (eval-reusable.yml -> docker_cmd.sh exec), and `tokenspeed_serve` runs the
    # TokenSpeed engine in its own container, so the entry needs a docker client
    # and a route to a daemon in there. Both now EXIST but neither is switched
    # on, and nothing has been observed working:
    #
    #   * Dockerfile.ci-gpu installs the client (docker/install_docker_cli.py).
    #     The installer was run for real and the binary it produces drives a
    #     live daemon, but the CI IMAGE has never been built -- the ROCm 10 base
    #     is ~52 GB and no machine with that much free disk has run the build.
    #   * The socket is a per-lane opt-in (`docker-socket: true` on the
    #     rocm-ci-setup action, mounting docker-compose.docker-socket.yaml). No
    #     lane sets it, deliberately: it grants effective root on the runner and
    #     that is the CI owner's call, not this branch's.
    #   * work_dir must then be set explicitly to the path that override mounts
    #     at the SAME string on both sides. The default is not sufficient by
    #     being equal to it -- see the work_dir section in the rollout doc.
    #
    # So the failure mode has moved from "'docker' not on PATH" to "cannot
    # connect to the Docker daemon", which reddens the nightly exactly as hard.
    # Promotion needs an observed container launch, not these three edits.
    # See docs/tokenspeed-gating-rollout.md for the remaining steps.
    blocked_on: >-
      docker client and socket override exist but are unproven and unswitched:
      the CI image has not been built, no lane sets docker-socket: true (a
      root-equivalent grant needing CI-owner sign-off), and no container launch
      from inside aorta-ci-gpu has been demonstrated

# dtype axis (fp32/fp16/bf16) is a follow-up: the smoke recipes pin one dtype
# each, so per-dtype coverage needs dtype recipe variants (or workload_config
# overrides). Add them as new rows here once those recipes exist -- no code change.
