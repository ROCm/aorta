name: Bump validation

# Validate stack-bump PRs (ROCm base image / Python deps / CI constraints) with
# the SAME nightly evaluation matrix + baseline comparison, so the correctness
# and baseline impact of a bump is visible before approval. Runs only for
# same-repository PRs (never fork PRs) on the self-hosted GPU runner.
#
# Scoped to the stack-defining files to protect the single runner; broader
# dependency changes are still covered by the nightly run.

on:
  pull_request:
    paths:
      - "docker/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "config/ci/ci-constraints.txt"

concurrency:
  group: bump-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate stack bump
    # Same-repo PRs only -- fork code must not run on the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/eval-reusable.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      do_alert: false      # PRs must not file/close the nightly regression issue
      # Explicitly off, not merely defaulted off. This lane runs PR head code on
      # the self-hosted runner, so it must have no route to the host docker
      # daemon -- a container that can reach the daemon can start a privileged
      # one bind-mounting /. Stating it here means a future change to the
      # input's default cannot silently arm the socket on a PR-triggered lane.
      # The tokenspeed_serve_smoke entry reports `skip` without it, by design.
      docker_socket: false
    secrets: inherit
