name: Refresh CI constraints

# Dispatch-only: regenerate config/ci/ci-constraints.txt (partial pip
# constraints, NOT a hash-pinned reproducible lock) from the resolved environment
# inside the pinned ROCm container, and open a PR. Pins reflect the actual CI
# ROCm/torch stack (generated where they're used). Pair with a ROCm/dependency
# bump PR so the constraints move with the stack.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lock-requirements-${{ github.workflow }}
  cancel-in-progress: false

env:
  CONTAINER_NAME: aorta-ci-gpu
  DEV_WHEELS_INDEX: https://github.com/ROCm/aorta/releases/expanded_assets/dev-wheels

jobs:
  lock:
    name: lock requirements (ROCm container)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60

    steps:
      - name: Reclaim workspace ownership
        run: |
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          uidgid="$(id -u):$(id -g)"
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          else
            sudo chown -R "$uidgid" "$ws" || true
          fi

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up ROCm CI container
        uses: ./.github/actions/rocm-ci-setup
        with:
          rocm-shared-key: ${{ secrets.ROCM_SHARED_KEY }}

      - name: Install stack and freeze lock
        run: |
          bash scripts/ci/docker_cmd.sh exec "${{ env.CONTAINER_NAME }}" bash -lc '
            set -euo pipefail
            cd /workspace/aorta
            python -m pip install --upgrade pip
            pip install --pre "amd-aorta[hw-queue]" -f "${{ env.DEV_WHEELS_INDEX }}"
            pip install -r requirements.txt
            bash scripts/ci/lock_requirements.sh
          '

      - name: Reclaim results ownership
        if: always()
        run: |
          ws="${{ github.workspace }}"
          uidgid="$(id -u):$(id -g)"
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws 2>/dev/null \
            || sudo -n chown -R "$uidgid" "$ws" 2>/dev/null || true

      - name: Tear down ROCm CI container
        if: always()
        working-directory: docker
        run: bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml down -v

      - name: Open constraints PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: config/ci/ci-constraints.txt
          branch: ci/refresh-constraints
          title: "ci: refresh CI dependency constraints"
          commit-message: "ci: refresh CI dependency constraints from the ROCm container"
          body: |
            Regenerated `config/ci/ci-constraints.txt` (partial pip constraints,
            captured inside the pinned ROCm container) by this workflow. This is
            NOT a hash-pinned reproducible lock -- it reduces drift for packages
            present at capture time. Review the diff and merge to adopt; CI installs
            apply it via `pip -c` when present.
