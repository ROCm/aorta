name: Nightly Evaluation

# CI plan (docs/ci-plan.md): after the nightly wheel is published, install THAT
# exact wheel and evaluate the workloads against committed expected-outcome
# baselines, capturing perf metrics as trend data. Runs inside the pinned ROCm
# docker image on the self-hosted MI350 runner; a separate ubuntu-latest job
# stores history on the ci-results branch. The dashboard is built + deployed to
# GitHub Pages by pages.yml (triggered on this workflow's completion).
#
# Correctness fails the job on any failed/errored cell, a missing matrix, a
# per-entry timeout, a blessed-baseline breach, or a run that did zero work.
# Cells without a baseline are recorded (record-only) so nightly isn't red before
# baselines land.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Nightly wheels"]
    types: [completed]

concurrency:
  group: nightly-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The GPU evaluation itself is a reusable workflow (eval-reusable.yml). Stack
  # bumps (dependabot pip/docker/actions PRs) are NOT validated per-PR on the
  # single self-hosted runner; the nightly run below (and on-demand dispatch)
  # exercises the merged stack against the same matrix + baselines instead.
  nightly-eval:
    name: nightly eval
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/eval-reusable.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      wheel_run_id: ${{ github.event.workflow_run.id || '' }}
      do_alert: true
    secrets: inherit

  # Append today's results to the ci-results data branch. The dashboard itself is
  # built + deployed to GitHub Pages by the separate pages.yml workflow (a repo
  # has a single Pages site, shared with the project landing page), which triggers
  # on this workflow's completion and reads the history from ci-results.
  publish:
    name: publish results history
    needs: nightly-eval
    # Run even when the eval failed (to record the failure), but NOT when it was
    # skipped (upstream "Nightly wheels" failed/cancelled) -- there'd be no
    # results artifact and publish would fail misleadingly.
    #
    # Gated to the default branch for the same two reasons as the canary's
    # publisher: this workflow is workflow_dispatch-triggerable, so without it a
    # run from an unreviewed branch could write the shared ci-results data
    # branch; and the workflow-level group above is ref-scoped, so branch runs
    # are NOT capped against each other and several could reach the shared
    # publish group at once. Branch runs still produce the artifact.
    if: >-
      always() && needs.nightly-eval.result != 'skipped'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shared with latest-rocm-canary.yml's publish job -- see the note there.
    # Both push the ci-results branch, so they must not overlap: the loser of a
    # race gets a non-fast-forward rejection and that run's history is lost.
    concurrency:
      group: ci-results-publish
      cancel-in-progress: false
    permissions:
      contents: write   # push results history to the ci-results branch

    steps:
      - name: Download results
        uses: actions/download-artifact@v6
        with:
          name: nightly-results-${{ github.run_id }}
          path: incoming

      - name: Update history branch (ci-results)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f incoming/gpu-nightly-results.json ] || { echo "no results JSON; skipping publish"; exit 0; }
          date="$(date -u +%Y-%m-%d)"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          # Fail closed: distinguish a genuinely-absent ci-results branch (create
          # the orphan) from a transport/auth failure (must NOT be treated as
          # "branch absent" -- that would truncate history to one day). git
          # ls-remote --exit-code: 0=present, 2=absent, else=error.
          set +e
          git ls-remote --exit-code --heads "$repo_url" ci-results >/dev/null 2>&1
          lsr=$?
          set -e
          if [ "$lsr" -eq 0 ]; then
            git clone --depth 1 --branch ci-results "$repo_url" "$tmp"
          elif [ "$lsr" -eq 2 ]; then
            echo "ci-results branch absent; creating it"
            git clone --depth 1 "$repo_url" "$tmp"
            ( cd "$tmp" && git checkout --orphan ci-results && git rm -rf . >/dev/null 2>&1 || true )
          else
            echo "::error::cannot reach ci-results (git ls-remote exit ${lsr}); failing closed"
            exit 1
          fi
          mkdir -p "$tmp/results"
          cp incoming/gpu-nightly-results.json "$tmp/results/${date}.json"
          # Retention: keep the most recent 180 result files.
          ls -1 "$tmp"/results/*.json 2>/dev/null | sort | head -n -180 | xargs -r rm -f
          ( cd "$tmp"
            git add -A
            if git -c user.name=aorta-ci -c user.email=aorta-ci@users.noreply.github.com \
                 commit -m "nightly results ${date}"; then
              git push origin ci-results   # not swallowed -- a push failure fails the job
            else
              echo "no changes to commit"
            fi )
