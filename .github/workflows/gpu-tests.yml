name: GPU Tests

# Phase 2 GPU merge gate: run the GPU-runnable slice of the pytest suite on the
# self-hosted MI350 runner inside a digest-pinned ROCm PyTorch container.
# Complements cpu-tests.yml (`not gpu and not rocm`) with no overlap -- see
# docs/ci-testing-plan.md and issue #268.
#
# After a stable soak period, mark `pytest (GPU, MI350)` as a required status
# check on `main` (branch protection) so GPU-touching PRs cannot merge red.

on:
  workflow_dispatch:
  schedule:
    # Nightly full GPU run (offset from nightly.yml at 11:00 UTC).
    - cron: "0 8 * * *"
  pull_request:
    paths:
      - "src/aorta/race/**"
      - "src/aorta/ebpf/**"
      - "src/aorta/hw_queue_eval/**"
      - "src/aorta/workloads/**"
      - "src/aorta/utils/gpu_control.py"
      - "tests/hw_queue_eval/**"
      - "tests/instrumentation/test_environment.py"
      - "tests/test_marker_partition.py"
      - "config/ci/**"
      - "recipes/ci/**"
      - "scripts/ci/**"
      - "docker/**"
      - ".github/workflows/gpu-tests.yml"

permissions:
  contents: read

# Protect the single GPU runner: one workflow run at a time per ref; newer PR
# pushes cancel the superseded run.
concurrency:
  group: gpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_COMPOSE_FILE: docker/docker-compose.build.yaml
  DOCKER_ENV_FILE: docker/.env.ci
  CONTAINER_NAME: aorta-ci-gpu

jobs:
  gpu-tests:
    name: pytest (GPU, MI350)
    runs-on: [self-hosted, gpu]
    # Security: never run untrusted fork-PR code on the self-hosted GPU runner.
    # Only same-repo PRs (plus schedule / dispatch) reach the runner. Fork PRs
    # also lack the ROCM_SHARED_KEY secret, so they could not authenticate anyway.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60

    steps:
      # The CI container runs as root and writes root-owned build artifacts
      # (.egg-info / __pycache__ / .pytest_cache) into the mounted checkout.
      # actions/checkout's `git clean` then runs as the runner user and cannot
      # delete them, failing the checkout. Reclaim ownership first via a
      # throwaway root container (repo scripts aren't checked out yet here).
      - name: Reclaim workspace ownership
        run: |
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          docker run --rm -v "$ws":/ws busybox chown -R "$(id -u):$(id -g)" /ws \
            || sudo chown -R "$(id -u):$(id -g)" "$ws" \
            || true

      - name: Check out code
        uses: actions/checkout@v5

      - name: Verify Docker access
        run: |
          bash scripts/ci/docker_cmd.sh info >/dev/null
          bash scripts/ci/docker_compose.sh version

      # rocm/pytorch is public on Docker Hub, so login is optional: it only
      # avoids pull rate limits. Skip cleanly when the secret is unavailable
      # (e.g. events without secret access) and never hard-fail the job on login.
      - name: Log in to container registry
        env:
          ROCM_SHARED_KEY: ${{ secrets.ROCM_SHARED_KEY }}
        run: |
          if [ -z "${ROCM_SHARED_KEY}" ]; then
            echo "ROCM_SHARED_KEY not set; using anonymous pulls (base image is public)."
            exit 0
          fi
          if ! printf '%s' "${ROCM_SHARED_KEY}" | bash scripts/ci/docker_cmd.sh login -u rocmshared --password-stdin; then
            echo "::warning::Docker Hub login failed (ROCM_SHARED_KEY may be expired). Continuing with anonymous pulls."
          fi

      - name: Build and start ROCm CI container
        working-directory: docker
        run: |
          bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml build
          bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml up -d

      - name: Install package and run GPU test suite
        run: |
          bash scripts/ci/docker_cmd.sh exec "${{ env.CONTAINER_NAME }}" bash -lc '
            set -euo pipefail
            cd /workspace/aorta
            python -m pip install --upgrade pip
            pip install -e ".[tests,hw-queue]"
            pytest -m "gpu or rocm" -n auto --junitxml=gpu-results.xml
          '

      - name: Upload GPU test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-test-results-${{ github.run_id }}
          path: gpu-results.xml
          if-no-files-found: ignore

      - name: Tear down ROCm CI container
        if: always()
        working-directory: docker
        run: bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml down -v

  gpu-regression:
    name: workload regression (GPU, MI350)
    runs-on: [self-hosted, gpu]
    needs: gpu-tests
    # Runs on every trigger. PRs run the fast, single-GPU "pr" tier; nightly /
    # dispatch run the full manifest (AORTA_CI_TIER below). Same fork-PR guard
    # as gpu-tests: no untrusted fork code on the self-hosted runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 120

    steps:
      # The CI container runs as root and writes root-owned build artifacts
      # (.egg-info / __pycache__ / .pytest_cache) into the mounted checkout.
      # actions/checkout's `git clean` then runs as the runner user and cannot
      # delete them, failing the checkout. Reclaim ownership first via a
      # throwaway root container (repo scripts aren't checked out yet here).
      - name: Reclaim workspace ownership
        run: |
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          docker run --rm -v "$ws":/ws busybox chown -R "$(id -u):$(id -g)" /ws \
            || sudo chown -R "$(id -u):$(id -g)" "$ws" \
            || true

      - name: Check out code
        uses: actions/checkout@v5

      - name: Verify Docker access
        run: |
          bash scripts/ci/docker_cmd.sh info >/dev/null
          bash scripts/ci/docker_compose.sh version

      # rocm/pytorch is public on Docker Hub, so login is optional: it only
      # avoids pull rate limits. Skip cleanly when the secret is unavailable
      # (e.g. events without secret access) and never hard-fail the job on login.
      - name: Log in to container registry
        env:
          ROCM_SHARED_KEY: ${{ secrets.ROCM_SHARED_KEY }}
        run: |
          if [ -z "${ROCM_SHARED_KEY}" ]; then
            echo "ROCM_SHARED_KEY not set; using anonymous pulls (base image is public)."
            exit 0
          fi
          if ! printf '%s' "${ROCM_SHARED_KEY}" | bash scripts/ci/docker_cmd.sh login -u rocmshared --password-stdin; then
            echo "::warning::Docker Hub login failed (ROCM_SHARED_KEY may be expired). Continuing with anonymous pulls."
          fi

      - name: Build and start ROCm CI container
        working-directory: docker
        run: |
          bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml build
          bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml up -d

      # PR gate runs the fast single-GPU subset; nightly / dispatch run everything.
      - name: Select regression tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=pr" >> "$GITHUB_OUTPUT"
          else
            echo "value=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package and run workload regression smokes
        run: |
          bash scripts/ci/docker_cmd.sh exec \
            -e AORTA_CI_TIER=${{ steps.tier.outputs.value }} \
            "${{ env.CONTAINER_NAME }}" bash -lc '
            set -euo pipefail
            cd /workspace/aorta
            python -m pip install --upgrade pip
            pip install -e ".[tests,hw-queue]"
            bash scripts/ci/run_gpu_regression_smokes.sh
          '

      - name: Tear down ROCm CI container
        if: always()
        working-directory: docker
        run: bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml down -v
