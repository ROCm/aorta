name: Latest ROCm canary

# Non-gating early warning for new ROCm releases (issue #382).
#
# The motivating idea was to point CI at `rocm/pytorch:latest` so we notice
# version regressions. Tracking versions is right; pointing the GATE at a moving
# tag is the part that backfires -- a red nightly becomes ambiguous (our
# regression, or did the base change under us?), and the run is neither
# reproducible nor bisectable afterwards. So this is a separate lane:
#
#   * the merge gate stays on the digest pin in docker/Dockerfile.ci-gpu, bumped
#     deliberately via PR, so bump-validate.yml still shows the numeric/perf
#     impact before a stack change lands;
#   * this lane follows `:latest`, but resolves it to a CONCRETE DIGEST at job
#     start and records that digest with the results. "Ran :latest" is not
#     attributable; "ran :latest, which resolved to sha256:..., ROCm 7.14.0,
#     torch 2.12.0" is.
#
# Non-gating is enforced three ways, not just intended:
#   1. it is its own workflow, so it cannot appear in nightly-eval.yml's graph
#      and cannot be added to branch protection by accident;
#   2. the eval step captures a non-zero EVALUATOR verdict instead of
#      propagating it, so a workload regression on a brand-new ROCm records a
#      row rather than painting a red X that nobody can action. A failure before
#      the evaluator even runs is different: it produces no row, so it is
#      recorded as a synthesised failure document AND fails this job, because a
#      silently-missing run is worse than a visible red one here. Either way it
#      is a distinct workflow, so nothing gated can see it;
#   3. results are published under `results/canary/` on the ci-results branch.
#      scripts/ci/gen_dashboard.py reads `results/*.json` NON-recursively, so
#      canary rows cannot contaminate the gated dashboard's history or trends,
#      and they reach the page only through a separate render path that feeds
#      neither status.json nor data.json.
#   4. .env.canary pins its own COMPOSE_PROJECT_NAME. Compose addresses the
#      SERVICE, and derives the project from the working directory when unset --
#      both lanes run compose from docker/ with the same `torchenv` service, so
#      without that pin this lane's `down -v` would delete the gate's container
#      and volumes mid-run. A distinct container name alone does not prevent it.
#
# The rows render on the dashboard under "Latest ROCm canary - observed only"
# (the #canary anchor), fed by gen_dashboard.py's --canary-results-dir. That is a
# separate argument from the gated --results-dir so the lane cannot reach the
# banner, the pass-rate trend, status.json or data.json, and the section carries
# no verdict colouring.
#
# This lane only became possible with issue #381: `rocm/pytorch:latest` is a
# wheel-based (TheRock) image with no /opt/rocm, so before layout-agnostic
# discovery it would have reported `rocm: null` and could not have built the GEMM
# fixtures, which defeats the purpose.

on:
  # 15:00 UTC: deliberately clear of the other GPU consumers on the shared MI350
  # runner -- gpu-tests 08:00, nightly-eval after the 11:00 wheels, sanitizers
  # 12:00. This lane is best-effort, so if it is ever squeezed out that is an
  # acceptable outcome; starving the gate is not.
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: latest-rocm-canary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANARY_TAG: rocm/pytorch:latest
  CONTAINER_NAME: aorta-rocm-canary
  DEV_WHEELS_INDEX: https://github.com/ROCm/aorta/releases/expanded_assets/dev-wheels

jobs:
  canary:
    name: latest ROCm canary (MI350, observed-only)
    # Scheduled runs only on the canonical repo: a fork has no MI350 runner, so
    # the cron would queue forever there.
    if: github.event_name != 'schedule' || github.repository == 'ROCm/aorta'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    # Read-only on purpose. This job pip-installs a wheel and runs workloads, so
    # it must not hold a token that could push to a data branch; publishing is a
    # separate job below. Same split nightly-eval.yml uses.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Reclaim workspace ownership
        run: |
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          uidgid="$(id -u):$(id -g)"
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          else
            sudo chown -R "$uidgid" "$ws" || true
          fi

      - name: Check out code
        uses: actions/checkout@v5
        with:
          # This job installs and executes a wheel from the dev index. Don't
          # leave a usable credential in .git/config where install-time or
          # workload code could recover it.
          persist-credentials: false

      - name: Verify Docker access
        run: |
          bash scripts/ci/docker_cmd.sh info >/dev/null
          bash scripts/ci/docker_compose.sh version

      # Optional, and only to avoid Docker Hub pull rate limits: the base is
      # public. Never hard-fail the canary on a login problem.
      - name: Log in to container registry
        env:
          ROCM_SHARED_KEY: ${{ secrets.ROCM_SHARED_KEY }}
        run: |
          if [ -z "${ROCM_SHARED_KEY}" ]; then
            echo "ROCM_SHARED_KEY not set; using anonymous pulls (base image is public)."
            exit 0
          fi
          if ! printf '%s' "${ROCM_SHARED_KEY}" | bash scripts/ci/docker_cmd.sh login -u rocmshared --password-stdin; then
            echo "::warning::Docker Hub login failed; continuing with anonymous pulls."
          fi

      # The step that makes this lane attributable. Resolve the moving tag ONCE,
      # here, and use the digest for both the build and the recorded results --
      # so even a tag that moves mid-run cannot make the row ambiguous.
      - name: Resolve :latest to a digest
        id: resolve
        run: |
          set -euo pipefail
          digest="$(bash scripts/ci/docker_cmd.sh buildx imagetools inspect "${CANARY_TAG}" \
            --format '{{println .Manifest.Digest}}' | head -n1 | tr -d '[:space:]')"
          if [ -z "${digest}" ]; then
            echo "::error::could not resolve ${CANARY_TAG} to a digest; refusing to build an unattributable canary"
            exit 1
          fi
          base="${CANARY_TAG}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "base_image=${base}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${CANARY_TAG} -> ${base}"
          { echo "### Latest ROCm canary"; echo; echo "- base image: \`${base}\`"; } >> "$GITHUB_STEP_SUMMARY"

      # Written to RUNNER_TEMP rather than exported: scripts/ci/docker_env.sh may
      # resolve docker to `sudo docker`, and sudo strips the environment, so a
      # plain env var would not reach compose's interpolation. Compose reads
      # --env-file for interpolation too, which survives sudo.
      - name: Build and start canary container
        working-directory: docker
        env:
          BASE_IMAGE: ${{ steps.resolve.outputs.base_image }}
        run: |
          set -euo pipefail
          envfile="${RUNNER_TEMP}/canary.env"
          cp .env.canary "$envfile"
          printf 'CANARY_BASE_IMAGE=%s\n' "${BASE_IMAGE}" >> "$envfile"
          echo "CANARY_ENV_FILE=$envfile" >> "$GITHUB_ENV"
          bash ../scripts/ci/docker_compose.sh --env-file "$envfile" \
            -f docker-compose.build.yaml -f docker-compose.canary.yaml build
          bash ../scripts/ci/docker_compose.sh --env-file "$envfile" \
            -f docker-compose.build.yaml -f docker-compose.canary.yaml up -d

      # A non-zero EVALUATOR verdict is suppressed (see the non-gating note in
      # the header) -- but only once a results document exists. A failure BEFORE
      # nightly_eval.py writes one (image start, wheel install, a :latest that
      # cannot even be set up) leaves nothing behind, the publish step skips it,
      # and the run vanishes from history -- losing precisely the
      # latest-ROCm incompatibility this lane exists to surface. So a missing
      # document gets an attributable row synthesised for it and fails the step.
      - name: Install wheel and run evaluation (observed-only)
        id: eval
        # always(), gated on the digest having resolved. Without this the step
        # keeps its implicit success() and is SKIPPED when the build/start step
        # fails -- including the case that matters most, where the layout guard
        # rejects a newly published :latest. The synthesis path below would then
        # never run, no attributable row would be uploaded, and the broken
        # release would vanish from history: the exact hole the synthesis was
        # added to close, one step earlier in the job. Gated on `resolve` because
        # without a digest there is nothing attributable to record.
        if: always() && steps.resolve.outcome == 'success'
        env:
          AORTA_CI_LANE: canary
          AORTA_CI_BASE_IMAGE: ${{ steps.resolve.outputs.base_image }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/ci/docker_cmd.sh exec \
            -e AORTA_CI_LANE="${AORTA_CI_LANE}" \
            -e AORTA_CI_BASE_IMAGE="${AORTA_CI_BASE_IMAGE}" \
            -e UPSTREAM_HEAD_SHA="${GITHUB_SHA}" \
            -e DEV_WHEELS_INDEX="${{ env.DEV_WHEELS_INDEX }}" \
            "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            cd /workspace/aorta
            python -m pip install --upgrade pip
            constraint=""
            [ -f config/ci/ci-constraints.txt ] && constraint="-c config/ci/ci-constraints.txt"
            # No exact-wheel path here: this lane tests a ROCm base, not a
            # specific aorta build, so it always takes the latest rc.
            pip install --pre "amd-aorta[hw-queue]" -f "$DEV_WHEELS_INDEX" $constraint
            python scripts/ci/nightly_eval.py --out gpu-canary-results.json
          ' || rc=$?
          echo "eval_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "- eval exit code: \`${rc}\`" >> "$GITHUB_STEP_SUMMARY"

          # Same quoting rules as the summary step below: single-quoted
          # `python3 -c`, no heredoc, values passed through the environment so
          # nothing needs escaping.
          if [ ! -f gpu-canary-results.json ]; then
            AORTA_CANARY_RC="${rc}" python3 -c '
          import datetime, json, os
          rc = os.environ.get("AORTA_CANARY_RC", "?")
          base = os.environ.get("AORTA_CI_BASE_IMAGE") or None
          json.dump(
              {
                  "schema_version": 1,
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  # Same keys build_metadata() emits, so the dashboard and any
                  # jq pipeline read one shape. Everything the container would
                  # have reported is null because it never got that far -- the
                  # digest is the fact worth keeping.
                  "build": {
                      "lane": "canary",
                      "base_image": base,
                      "amd_aorta_version": None,
                      "torch": None,
                      "hip": None,
                      "rocm": None,
                      "upstream_run_id": None,
                      "head_sha": os.environ.get("GITHUB_SHA"),
                      "wheel_file": None,
                  },
                  "summary": {"total": 0, "pass": 0, "fail": 0, "record": 0, "skip": 0},
                  "entries": [],
                  "error": f"canary setup failed before the evaluator ran (exit {rc}); no workloads were evaluated",
              },
              open("gpu-canary-results.json", "w"),
              indent=2,
          )
          '
            echo "- result: \`setup failed before the evaluator ran\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::canary produced no results document (exit ${rc}) on ${{ steps.resolve.outputs.base_image }}; recorded an attributable failure row. This is isolated from the merge gate."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::warning::canary eval exited ${rc} on ${{ steps.resolve.outputs.base_image }} (observed-only; not a gate)"
          fi

      - name: Reclaim results ownership
        if: always()
        run: |
          ws="${{ github.workspace }}"
          uidgid="$(id -u):$(id -g)"
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws 2>/dev/null \
            || sudo -n chown -R "$uidgid" "$ws" 2>/dev/null || true

      # Deliberately `python3 -c '...'` and not a heredoc: an indented closer
      # inside a `run: |` block does not terminate a heredoc, and a column-0
      # closer breaks the YAML block scalar -- a failure that only shows up in
      # CI. The payload is single-quoted so the backticks below stay literal
      # instead of becoming command substitution, which also means it must
      # contain no single quotes of its own.
      - name: Summarise the observed stack
        if: always()
        run: |
          set -uo pipefail
          [ -f gpu-canary-results.json ] || { echo "no results JSON produced"; exit 0; }
          python3 -c '
          import json
          # nightly_eval.py puts build_metadata() under "build" (the same key
          # gen_dashboard.py reads), not "metadata".
          doc = json.load(open("gpu-canary-results.json"))
          build = doc.get("build") or {}
          for key in ("lane", "base_image", "rocm", "torch", "hip", "amd_aorta_version"):
              print("- " + key + ": `" + str(build.get(key)) + "`")
          summary = doc.get("summary") or {}
          if summary:
              print("- summary: `" + json.dumps(summary, sort_keys=True) + "`")
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canary-results-${{ github.run_id }}
          path: |
            gpu-canary-results.json
            .nightly-eval/**/matrix.json
            .nightly-eval/**/recipe.resolved.yaml
          if-no-files-found: warn

      - name: Tear down canary container
        if: always()
        working-directory: docker
        run: |
          envfile="${CANARY_ENV_FILE:-${RUNNER_TEMP}/canary.env}"
          [ -f "$envfile" ] || { echo "no canary env file; nothing to tear down"; exit 0; }
          bash ../scripts/ci/docker_compose.sh --env-file "$envfile" \
            -f docker-compose.build.yaml -f docker-compose.canary.yaml down -v

  # Separate job so the write-capable token never sits in the environment that
  # installs and runs a wheel, mirroring nightly-eval.yml's eval/publish split.
  publish:
    name: publish canary history
    needs: canary
    # Gated to the default branch: this workflow is workflow_dispatch-triggerable,
    # so without this a run from an unreviewed branch could write to the shared
    # ci-results data branch. Branch runs still produce the artifact.
    if: always() && needs.canary.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shared with nightly-eval.yml's publish job: two workflows now clone,
    # commit and push the SAME ci-results branch. Writing different directories
    # does not help -- git pushes a whole ref, so an overlap means both commit
    # from the same head and the loser gets a non-fast-forward rejection, losing
    # that run's history entirely. The group name is global to the repo, so
    # naming it identically in both places is what serialises them.
    # cancel-in-progress stays false so the loser queues instead of dying. That
    # is only safe because each workflow ALSO has a workflow-level group above,
    # capping this one at a single in-flight run per workflow: at most two jobs
    # can ever contend here, and GitHub only cancels a pending job when a THIRD
    # arrives. Drop either workflow-level group and this needs rethinking.
    concurrency:
      group: ci-results-publish
      cancel-in-progress: false
    permissions:
      contents: write   # publish canary history to the ci-results branch

    steps:
      - name: Download canary results
        # Non-fatal: the upload step is `if-no-files-found: warn`, so a canary
        # that died before producing a row (a registry hiccup resolving :latest
        # skips the eval step) leaves NO artifact, and download-artifact treats
        # that as an error. Failing here would put a red X on a deliberately
        # non-gating lane, and it would make the "no results JSON; skipping
        # publish" guard in the next step unreachable dead code.
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: canary-results-${{ github.run_id }}
          path: incoming

      # Published under results/canary/ so the gated dashboard cannot see it:
      # gen_dashboard.py globs results/*.json non-recursively.
      - name: Update history branch (ci-results)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f incoming/gpu-canary-results.json ] || { echo "no results JSON; skipping publish"; exit 0; }
          date="$(date -u +%Y-%m-%d)"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          # Same fail-closed branch probe as nightly-eval.yml: 0=present,
          # 2=absent, anything else is a transport/auth failure that must NOT be
          # mistaken for "absent" (that would truncate history to one day).
          set +e
          git ls-remote --exit-code --heads "$repo_url" ci-results >/dev/null 2>&1
          lsr=$?
          set -e
          if [ "$lsr" -eq 0 ]; then
            git clone --depth 1 --branch ci-results "$repo_url" "$tmp"
          elif [ "$lsr" -eq 2 ]; then
            echo "ci-results branch absent; creating it"
            git clone --depth 1 "$repo_url" "$tmp"
            ( cd "$tmp" && git checkout --orphan ci-results && git rm -rf . >/dev/null 2>&1 || true )
          else
            echo "::error::cannot reach ci-results (git ls-remote exit ${lsr}); failing closed"
            exit 1
          fi
          mkdir -p "$tmp/results/canary"
          cp incoming/gpu-canary-results.json "$tmp/results/canary/${date}.json"
          # Own retention, independent of the gated lane's 180.
          ls -1 "$tmp"/results/canary/*.json 2>/dev/null | sort | head -n -180 | xargs -r rm -f
          ( cd "$tmp"
            git add -A
            if git -c user.name=aorta-ci -c user.email=aorta-ci@users.noreply.github.com \
                 commit -m "canary results ${date}"; then
              git push origin ci-results
            else
              echo "no changes to commit"
            fi )
