name: Sanitizers Nightly

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# The dashboard is surfaced via the run's job summary + an uploaded artifact.
# GitHub Pages is owned solely by the "Pages" workflow (one Pages site per repo),
# so this workflow deliberately does not request pages/id-token.
permissions:
  contents: read

concurrency:
  group: sanitizers-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Immutable RocJITsu input. rocm-systems is public, so the checkout needs no
  # token. TODO(#330): replace this branch ref with the reviewed commit SHA so
  # the gate pins an immutable input rather than a mutable branch.
  ROCJITSU_REF: "shared/rocjitsu/sanitizers"

jobs:
  sanitizers-gpu:
    name: gfx950 sanitizer regression
    # Must match a real online runner: the MI350 host is labelled
    # `self-hosted, gpu, mi350x` (same set the other GPU workflows target, e.g.
    # gpu-tests.yml / eval-reusable.yml use `self-hosted, gpu`).
    runs-on: [self-hosted, gpu, mi350x]
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install aorta
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests]"

      - name: Build rocjitsu sanitizer binaries
        run: |
          set -euo pipefail
          ROCJITSU_SRC="${RUNNER_TEMP}/rocjitsu-src"
          ROCJITSU_BUILD="${RUNNER_TEMP}/rocjitsu-build"
          # Token-free clone of the public repo, pinned to an explicit ref.
          git clone --filter=blob:none https://github.com/ROCm/rocm-systems.git "${ROCJITSU_SRC}"
          git -C "${ROCJITSU_SRC}" checkout "${ROCJITSU_REF}"
          echo "ROCJITSU checkout: $(git -C "${ROCJITSU_SRC}" rev-parse HEAD)"
          cmake -S "${ROCJITSU_SRC}/emulation/rocjitsu" -B "${ROCJITSU_BUILD}" -GNinja
          ninja -C "${ROCJITSU_BUILD}" rj_waitcheck rocjitsu_dbi_hooks
          echo "ROCJITSU_BUILD=${ROCJITSU_BUILD}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-13/root/usr/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Build ConSan repro binaries
        run: |
          set -euo pipefail
          FIXTURES=recipes/sanitizers/fixtures
          mkdir -p "$FIXTURES/bin" "$FIXTURES/isa"
          hipcc --offload-arch=gfx950 -O1 -g "$FIXTURES/repro/consan_lds_race.hip" -o "$FIXTURES/bin/consan_lds_race"
          hipcc --offload-arch=gfx950 -O1 -g "$FIXTURES/repro/consan_lds_race_2wave.hip" -o "$FIXTURES/bin/consan_lds_race_2wave"
          python scripts/sanitizers/prepare_gemm_isa.py --csv "$FIXTURES/gemm_shapes_unique.csv" --out "$FIXTURES/isa" --top-n 3

      # Positive-control recipes (e.g. the racy repro) intentionally exit non-zero
      # via the guardrail-safe CLI. The authoritative gate is the baseline
      # comparator below, so these steps only need to *produce* reports.
      - name: Run waitcheck recipe
        continue-on-error: true
        run: |
          aorta sweep run --recipe recipes/sanitizers/daily-waitcheck-gemm.yaml \
            --output-dir "${RUNNER_TEMP}/sanitizer-out/waitcheck"

      - name: Run ConSan clean recipe
        continue-on-error: true
        run: |
          aorta sweep run --recipe recipes/sanitizers/daily-consan-clean.yaml \
            --output-dir "${RUNNER_TEMP}/sanitizer-out/consan-clean"

      - name: Run ConSan racy recipe
        continue-on-error: true
        run: |
          aorta sweep run --recipe recipes/sanitizers/daily-consan-racy.yaml \
            --output-dir "${RUNNER_TEMP}/sanitizer-out/consan-racy"

      - name: Compare verdict baselines
        run: python scripts/sanitizers/compare_verdict_baselines.py "${RUNNER_TEMP}/sanitizer-out"

      - name: Upload sanitizer results
        # Always upload whatever ran, even when an earlier step (e.g. the baseline
        # comparison) failed, so the publish job can render the failure with any
        # partial evidence instead of the run silently producing nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/sanitizer-out
          if-no-files-found: warn

      - name: Clean up build/temp state
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/rocjitsu-src" "${RUNNER_TEMP}/rocjitsu-build" \
                 "${RUNNER_TEMP}/sanitizer-out" \
                 recipes/sanitizers/fixtures/bin recipes/sanitizers/fixtures/isa

  publish:
    name: publish sanitizer dashboard
    needs: sanitizers-gpu
    # Run even when the GPU job failed (to publish the failure, not a stale green
    # page) but NOT when it was skipped. Publish ONLY from main: a workflow_dispatch
    # branch run still executes sanitizers-gpu and uploads its artifact, but must
    # never push branch output onto the public sanitizer-results branch (that would
    # bypass branch protection). Branch runs therefore produce artifacts only.
    if: >-
      always() &&
      needs.sanitizers-gpu.result != 'skipped' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push dashboard to the sanitizer-results branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        # A failed GPU job may leave no artifact at all; don't hard-fail the
        # publish job -- we still want to record the failure on the public page.
        continue-on-error: true
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: incoming
      - name: Record run status
        # Manifest consumed by gen_sanitizer_dashboard.py (--status) to render a
        # stale banner, and persisted to the data branch so Pages can tell a
        # healthy snapshot from a stale one on every subsequent deploy.
        env:
          GPU_RESULT: ${{ needs.sanitizers-gpu.result }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [ "${GPU_RESULT}" = "success" ]; then healthy=true; else healthy=false; fi
          python - "$healthy" "$GPU_RESULT" > status.json <<'PY'
          import json, os, sys
          healthy = sys.argv[1] == "true"
          conclusion = sys.argv[2]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          from datetime import datetime, timezone
          print(json.dumps({
              "healthy": healthy,
              "conclusion": conclusion,
              "run_id": run_id,
              "run_url": f"{server}/{repo}/actions/runs/{run_id}",
              "commit": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "date": datetime.now(tz=timezone.utc).isoformat(timespec="seconds"),
          }, indent=2, sort_keys=True))
          PY
          cat status.json

      - name: Generate sanitizer dashboard
        run: |
          python scripts/sanitizers/gen_sanitizer_dashboard.py \
            --results-dir incoming \
            --baselines recipes/sanitizers/fixtures/expected/verdict_baselines.json \
            --commit "${GITHUB_SHA}" --run-label "run ${GITHUB_RUN_ID}" \
            --status status.json \
            --out-dir dashboard
          cat dashboard/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update sanitizer-results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -d dashboard ] || { echo "no dashboard/; skipping publish"; exit 0; }
          date="$(date -u +%Y-%m-%d)"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          # Fail closed: distinguish a genuinely-absent sanitizer-results branch
          # (create the orphan) from a transport/auth failure (must NOT be treated
          # as "branch absent"). git ls-remote --exit-code: 0=present, 2=absent,
          # else=error.
          set +e
          git ls-remote --exit-code --heads "$repo_url" sanitizer-results >/dev/null 2>&1
          lsr=$?
          set -e
          if [ "$lsr" -eq 0 ]; then
            git clone --depth 1 --branch sanitizer-results "$repo_url" "$tmp"
          elif [ "$lsr" -eq 2 ]; then
            echo "sanitizer-results branch absent; creating it"
            git clone --depth 1 "$repo_url" "$tmp"
            ( cd "$tmp" && git checkout --orphan sanitizer-results && git rm -rf . >/dev/null 2>&1 || true )
          else
            echo "::error::cannot reach sanitizer-results (git ls-remote exit ${lsr}); failing closed"
            exit 1
          fi
          rm -rf "$tmp/dashboard"
          cp -a dashboard "$tmp/dashboard"
          ( cd "$tmp"
            git add -A
            if git -c user.name=aorta-ci -c user.email=aorta-ci@users.noreply.github.com \
                 commit -m "sanitizer dashboard ${date}"; then
              git push origin sanitizer-results   # not swallowed -- a push failure fails the job
            else
              echo "no changes to commit"
            fi )

      - name: Upload sanitizer dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-dashboard-${{ github.run_id }}
          path: dashboard
