name: Sanitizers Nightly

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sanitizers-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sanitizers-gpu:
    name: gfx950 sanitizer regression
    runs-on: [self-hosted, mi350]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install aorta
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests]"

      - name: Build rocjitsu sanitizer binaries
        env:
          ROCJITSU_REPO_TOKEN: ${{ secrets.ROCJITSU_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ROCJITSU_REPO_TOKEN:-}" || {
            echo "ROCJITSU_REPO_TOKEN is required to clone the private rocjitsu branch"
            exit 1
          }
          git clone --depth 1 --branch shared/rocjitsu/sanitizers \
            "https://x-access-token:${ROCJITSU_REPO_TOKEN}@github.com/ROCm/rocm-systems.git" /tmp/rocjitsu-src
          cmake -S /tmp/rocjitsu-src/emulation/rocjitsu -B /tmp/rocjitsu-build -GNinja
          ninja -C /tmp/rocjitsu-build rj_waitcheck rocjitsu_dbi_hooks
          export ROCJITSU_BUILD=/tmp/rocjitsu-build
          echo "ROCJITSU_BUILD=${ROCJITSU_BUILD}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-13/root/usr/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Build ConSan repro binaries
        run: |
          set -euo pipefail
          FIXTURES=recipes/sanitizers/fixtures
          mkdir -p "$FIXTURES/bin" "$FIXTURES/isa"
          hipcc --offload-arch=gfx950 -O1 -g "$FIXTURES/repro/consan_lds_race.hip" -o "$FIXTURES/bin/consan_lds_race"
          hipcc --offload-arch=gfx950 -O1 -g "$FIXTURES/repro/consan_lds_race_2wave.hip" -o "$FIXTURES/bin/consan_lds_race_2wave"
          python scripts/sanitizers/prepare_gemm_isa.py --csv "$FIXTURES/gemm_shapes_unique.csv" --out "$FIXTURES/isa" --top-n 3

      - name: Run waitcheck recipe
        run: |
          aorta sweep run --recipe recipes/sanitizers/daily-waitcheck-gemm.yaml \
            --output-dir /tmp/sanitizer-out/waitcheck

      - name: Run ConSan clean recipe
        run: |
          aorta sweep run --recipe recipes/sanitizers/daily-consan-clean.yaml \
            --output-dir /tmp/sanitizer-out/consan-clean

      - name: Run ConSan racy recipe
        run: |
          aorta sweep run --recipe recipes/sanitizers/daily-consan-racy.yaml \
            --output-dir /tmp/sanitizer-out/consan-racy

      - name: Compare verdict baselines
        run: python scripts/sanitizers/compare_verdict_baselines.py /tmp/sanitizer-out

      - name: Upload sanitizer results
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: /tmp/sanitizer-out

  publish:
    name: publish sanitizer dashboard
    needs: sanitizers-gpu
    if: always() && needs.sanitizers-gpu.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: incoming
      - name: Update sanitizer history
        run: python scripts/sanitizers/update_history.py incoming
