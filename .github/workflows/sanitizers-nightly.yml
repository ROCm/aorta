name: Sanitizers Nightly

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# The dashboard is surfaced via the run's job summary + an uploaded artifact.
# GitHub Pages is owned solely by the "Pages" workflow (one Pages site per repo),
# so this workflow deliberately does not request pages/id-token.
permissions:
  contents: read

concurrency:
  group: sanitizers-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_NAME: aorta-ci-gpu
  # Branch whose prebuilt sanitizer artifacts we consume. The nightly no longer
  # clones + builds rocm-systems from source (#350); it downloads the bundle
  # published by ROCm/rocm-systems' `rocjitsu-sanitizer-artifacts` workflow and
  # points the resolvers at it via ROCJITSU_PREBUILT. `--run latest` on this
  # branch is resolved by the upstream downloader.
  # TODO(#330): these are ephemeral (30-day) Actions artifacts, not an immutable
  # Release. For a truly immutable gate, pin an explicit reviewed run ID (record
  # the commit from the bundle's MANIFEST.json for provenance) or promote the
  # build to a durable store.
  ROCJITSU_REF: "shared/rocjitsu/sanitizers"

jobs:
  sanitizers-gpu:
    name: gfx950 sanitizer regression
    # Must match a real online runner: the MI350 host is labelled
    # `self-hosted, gpu, mi350x` (same set the other GPU workflows target, e.g.
    # gpu-tests.yml / eval-reusable.yml use `self-hosted, gpu`).
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    steps:
      # Sibling GPU jobs (gpu-tests.yml et al.) run aorta in a root ROCm CI
      # container that leaves root-owned artifacts (e.g. results/gpu_smoke) in
      # the mounted checkout. actions/checkout's `git clean` runs as the runner
      # user and cannot delete them. Reclaim ownership first via a throwaway
      # root container (repo scripts aren't checked out yet here).
      - name: Reclaim workspace ownership
        run: |
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          uidgid="$(id -u):$(id -g)"
          # Pinned by digest for supply-chain safety / reproducibility on the
          # self-hosted runner (busybox:1.37).
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          # Repo scripts aren't checked out yet, so resolve docker access inline.
          # Support runners with direct docker, sudo docker, or only host sudo.
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          else
            sudo chown -R "$uidgid" "$ws" || true
          fi

      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up ROCm CI container
        uses: ./.github/actions/rocm-ci-setup
        with:
          rocm-shared-key: ${{ secrets.ROCM_SHARED_KEY }}

      # Host hipcc is not a reliable ROCm toolchain (e.g. it may point at a
      # missing /opt/rocm/llvm/bin/clang-*). Run the full sanitizer gate inside
      # the same pinned ROCm container as gpu-tests.yml / eval-reusable.yml.
      # Workspace-relative paths keep artifacts visible on the host for upload.
      - name: Run sanitizer regression
        env:
          # Downloading GitHub Actions artifacts requires a token with
          # `actions:read` -- even for a public repo. The default GITHUB_TOKEN is
          # scoped to THIS repo (ROCm/aorta) only and CANNOT read another repo's
          # (ROCm/rocm-systems) artifacts, so a PAT with `actions:read` on
          # rocm-systems must be provided as the ROCJITSU_ARTIFACTS_TOKEN secret.
          # The GITHUB_TOKEN fallback keeps the step wired, but will 403 on the
          # cross-repo download until the secret is configured.
          ROCJITSU_ARTIFACTS_TOKEN: ${{ secrets.ROCJITSU_ARTIFACTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci/docker_cmd.sh exec \
            -e ROCJITSU_REF="${ROCJITSU_REF}" \
            -e GH_TOKEN="${ROCJITSU_ARTIFACTS_TOKEN}" \
            "${{ env.CONTAINER_NAME }}" bash -lc '
            set -euo pipefail
            cd /workspace/aorta
            SANITIZER_ROOT=".sanitizer-nightly"
            ROCJITSU_PREBUILT="${SANITIZER_ROOT}/rocjitsu-prebuilt"
            SANITIZER_OUT="${SANITIZER_ROOT}/out"
            FIXTURES=recipes/sanitizers/fixtures

            python -m pip install --upgrade pip
            pip install -e ".[tests]"

            # Consume the prebuilt sanitizer bundle published by
            # ROCm/rocm-systems (#350): fetch the upstream downloader, then pull
            # bin/rj_waitcheck + lib/librocjitsu_dbi_hooks.so for the latest
            # successful run on ${ROCJITSU_REF}. This replaces the old
            # clone + cmake source build, whose docker toolchain deps (cmake,
            # ninja, libzstd-dev, g++-13, Findzstd shim) have been removed from
            # docker/Dockerfile.ci-gpu.
            # Downloading Actions artifacts requires a token with actions:read
            # even though rocm-systems is public: the unauthenticated artifact
            # /zip endpoint returns 401 and no equivalent GitHub Release exists.
            # See the step env (GH_TOKEN) and the token note there.
            rm -rf "${ROCJITSU_PREBUILT}"
            mkdir -p "${SANITIZER_ROOT}"
            DL_SCRIPT="${SANITIZER_ROOT}/download_sanitizer_artifacts.py"
            python - "${DL_SCRIPT}" "${ROCJITSU_REF}" <<"PY"
          import os, sys, urllib.request
          dest, ref = sys.argv[1], sys.argv[2]
          url = (
              "https://api.github.com/repos/ROCm/rocm-systems/contents/"
              "emulation/rocjitsu/scripts/download_sanitizer_artifacts.py?ref=" + ref
          )
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""
          headers = {"Accept": "application/vnd.github.raw",
                     "User-Agent": "aorta-sanitizers-nightly"}
          if token:
              headers["Authorization"] = "Bearer " + token
          with urllib.request.urlopen(
              urllib.request.Request(url, headers=headers), timeout=60
          ) as resp:
              body = resp.read()
          with open(dest, "wb") as fh:
              fh.write(body)
          PY
            python "${DL_SCRIPT}" --branch "${ROCJITSU_REF}" \
              --dest "${ROCJITSU_PREBUILT}" --force
            export ROCJITSU_PREBUILT="$(cd "${ROCJITSU_PREBUILT}" && pwd)"
            echo "ROCJITSU_PREBUILT=${ROCJITSU_PREBUILT}"
            # Record the source commit for provenance (bundle is ephemeral).
            python -c "import json,sys; m=json.load(open(sys.argv[1])); \
              print(\"ROCJITSU bundle commit:\", m.get(\"commit\"), \
              \"run:\", m.get(\"run_url\"))" \
              "${ROCJITSU_PREBUILT}/MANIFEST.json"

            # hipcc shells out to clang-offload-bundler, which lives in the ROCm
            # LLVM bindir but is not on PATH -- the image only exports
            # /opt/rocm/bin -- so the fixture
            # build failed with "clang-offload-bundler not found on PATH" (run
            # 31161251100). Add the LLVM bindir so hipcc can find its tools.
            export PATH="${ROCM_PATH:-${ROCM_HOME:-/opt/rocm}}/lib/llvm/bin:${PATH}"

            mkdir -p "${FIXTURES}/bin" "${FIXTURES}/isa"
            hipcc --offload-arch=gfx950 -O1 -g "${FIXTURES}/repro/consan_lds_race.hip" \
              -o "${FIXTURES}/bin/consan_lds_race"
            hipcc --offload-arch=gfx950 -O1 -g "${FIXTURES}/repro/consan_lds_race_2wave.hip" \
              -o "${FIXTURES}/bin/consan_lds_race_2wave"
            python scripts/sanitizers/prepare_gemm_isa.py \
              --csv "${FIXTURES}/gemm_shapes_unique.csv" --out "${FIXTURES}/isa" --top-n 3

            # Positive-control recipes intentionally exit non-zero via the
            # guardrail-safe CLI. The authoritative gate is the baseline
            # comparator below, so these only need to produce reports.
            mkdir -p "${SANITIZER_OUT}/waitcheck" "${SANITIZER_OUT}/consan-clean" "${SANITIZER_OUT}/consan-racy"
            aorta sweep run --recipe recipes/sanitizers/daily-waitcheck-gemm.yaml \
              --output-dir "${SANITIZER_OUT}/waitcheck" || true
            aorta sweep run --recipe recipes/sanitizers/daily-consan-clean.yaml \
              --output-dir "${SANITIZER_OUT}/consan-clean" || true
            aorta sweep run --recipe recipes/sanitizers/daily-consan-racy.yaml \
              --output-dir "${SANITIZER_OUT}/consan-racy" || true

            python scripts/sanitizers/compare_verdict_baselines.py "${SANITIZER_OUT}"
          '

      - name: Reclaim results ownership
        if: always()
        run: |
          ws="${{ github.workspace }}"
          uidgid="$(id -u):$(id -g)"
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          else
            sudo chown -R "$uidgid" "$ws" || true
          fi

      - name: Upload sanitizer results
        # Always upload whatever ran, even when an earlier step (e.g. the baseline
        # comparison) failed, so the publish job can render the failure with any
        # partial evidence instead of the run silently producing nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: .sanitizer-nightly/out
          if-no-files-found: warn

      - name: Clean up build/temp state
        if: always()
        run: |
          rm -rf .sanitizer-nightly \
                 recipes/sanitizers/fixtures/bin recipes/sanitizers/fixtures/isa

      - name: Tear down ROCm CI container
        if: always()
        working-directory: docker
        run: bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml down -v

  publish:
    name: publish sanitizer dashboard
    needs: sanitizers-gpu
    # Run even when the GPU job failed (to publish the failure, not a stale green
    # page) but NOT when it was skipped. Publish ONLY from main: a workflow_dispatch
    # branch run still executes sanitizers-gpu and uploads its artifact, but must
    # never push branch output onto the public sanitizer-results branch (that would
    # bypass branch protection). Branch runs therefore produce artifacts only.
    if: >-
      always() &&
      needs.sanitizers-gpu.result != 'skipped' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push dashboard to the sanitizer-results branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        # A failed GPU job may leave no artifact at all; don't hard-fail the
        # publish job -- we still want to record the failure on the public page.
        continue-on-error: true
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: incoming
      - name: Record run status
        # Manifest consumed by gen_sanitizer_dashboard.py (--status) to render a
        # stale banner, and persisted to the data branch so Pages can tell a
        # healthy snapshot from a stale one on every subsequent deploy.
        env:
          GPU_RESULT: ${{ needs.sanitizers-gpu.result }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [ "${GPU_RESULT}" = "success" ]; then healthy=true; else healthy=false; fi
          python - "$healthy" "$GPU_RESULT" > status.json <<'PY'
          import json, os, sys
          healthy = sys.argv[1] == "true"
          conclusion = sys.argv[2]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          from datetime import datetime, timezone
          print(json.dumps({
              "healthy": healthy,
              "conclusion": conclusion,
              "run_id": run_id,
              "run_url": f"{server}/{repo}/actions/runs/{run_id}",
              "commit": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "date": datetime.now(tz=timezone.utc).isoformat(timespec="seconds"),
          }, indent=2, sort_keys=True))
          PY
          cat status.json

      - name: Publish sanitizer dashboard to sanitizer-results branch
        # Preserve the accumulated per-run history on the data branch: clone it,
        # co-locate THIS run's raw reports under dashboard/runs/<date>-<run_id>/,
        # prune to a rolling window, then regenerate the rendered dashboard from
        # the merged history and push. The old "wipe dashboard/ and re-copy" flow
        # destroyed every prior run's raw reports, so it is deliberately gone.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_RESULT: ${{ needs.sanitizers-gpu.result }}
        run: |
          set -euo pipefail
          keep=30
          date="$(date -u +%Y-%m-%d)"
          run_dir_id="${date}-${GITHUB_RUN_ID}"   # <YYYY-MM-DD>-<run_id>: date-sortable + unique
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          # Fail closed: distinguish a genuinely-absent sanitizer-results branch
          # (create the orphan) from a transport/auth failure (must NOT be treated
          # as "branch absent"). git ls-remote --exit-code: 0=present, 2=absent,
          # else=error.
          set +e
          git ls-remote --exit-code --heads "$repo_url" sanitizer-results >/dev/null 2>&1
          lsr=$?
          set -e
          if [ "$lsr" -eq 0 ]; then
            git clone --depth 1 --branch sanitizer-results "$repo_url" "$tmp"
          elif [ "$lsr" -eq 2 ]; then
            echo "sanitizer-results branch absent; creating it"
            git clone --depth 1 "$repo_url" "$tmp"
            ( cd "$tmp" && git checkout --orphan sanitizer-results && git rm -rf . >/dev/null 2>&1 || true )
          else
            echo "::error::cannot reach sanitizer-results (git ls-remote exit ${lsr}); failing closed"
            exit 1
          fi

          # Stage this run's raw reports next to the preserved history (never wipe
          # dashboard/runs/). A failed/absent report is simply not copied; the
          # generator then renders that case as missing -> a red per-run gate.
          runs_dir="$tmp/dashboard/runs"
          dest="$runs_dir/${run_dir_id}"
          # A same-day Actions re-run reuses GITHUB_RUN_ID (only GITHUB_RUN_ATTEMPT
          # changes), so it targets this same directory. Clear it first so a report
          # absent from the current attempt cannot survive from a prior one and mask
          # a now-missing case (the generator fails such a case closed).
          rm -rf "$dest"
          mkdir -p "$dest"
          for case in waitcheck consan-clean consan-racy; do
            report="incoming/${case}/sanitizer_report.json"
            if [ -f "$report" ]; then
              mkdir -p "$dest/${case}"
              cp -a "$report" "$dest/${case}/sanitizer_report.json"
            fi
          done

          # Per-run manifest read back by gen_sanitizer_dashboard.py --history-root.
          # gate mirrors the GPU job result (its comparator step is the gate); the
          # rendered history recomputes it from the reports + baselines regardless.
          if [ "${GPU_RESULT}" = "success" ]; then gate=true; else gate=false; fi
          python - "$run_dir_id" "$date" "$gate" > "$dest/meta.json" <<'PY'
          import json, os, sys
          run_id, date, gate = sys.argv[1], sys.argv[2], sys.argv[3] == "true"
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          gh_run = os.environ.get("GITHUB_RUN_ID", "")
          print(json.dumps({
              "run": run_id,
              "commit": os.environ.get("GITHUB_SHA", ""),
              "date": date,
              "gpu": "gfx950",
              "run_url": f"{server}/{repo}/actions/runs/{gh_run}",
              "gate": gate,
          }, indent=2, sort_keys=True))
          PY

          # Rolling window: drop all but the newest N run directories. Sort by the
          # date fields then the run-id numerically (-t- splits <YYYY-MM-DD>-<run_id>
          # into fields 1-4), so a variable-width run id (...-9 vs ...-10) still
          # orders newest-first -- a plain lexical sort would prune the wrong dir.
          if [ -d "$runs_dir" ]; then
            ls -1 "$runs_dir" \
              | sort -t- -k1,1nr -k2,2nr -k3,3nr -k4,4nr \
              | tail -n +"$((keep + 1))" | while IFS= read -r old; do
              [ -n "$old" ] && rm -rf "${runs_dir:?}/${old}"
            done
          fi

          # Regenerate the rendered dashboard from the merged, pruned history. This
          # also writes each retained run's tiny runs/<id>/index.html landing page.
          python scripts/sanitizers/gen_sanitizer_dashboard.py \
            --history-root "$runs_dir" --keep "$keep" \
            --baselines recipes/sanitizers/fixtures/expected/verdict_baselines.json \
            --commit "${GITHUB_SHA}" --run-label "run ${GITHUB_RUN_ID}" \
            --status status.json \
            --out-dir "$tmp/dashboard"

          # Mirror the rendered dashboard to the workspace and append the job
          # summary BEFORE pushing, so both survive even if the push later fails.
          rm -rf dashboard
          cp -a "$tmp/dashboard" dashboard
          cat dashboard/summary.md >> "$GITHUB_STEP_SUMMARY"

          ( cd "$tmp"
            git add -A
            if git -c user.name=aorta-ci -c user.email=aorta-ci@users.noreply.github.com \
                 commit -m "sanitizer dashboard ${date} (run ${GITHUB_RUN_ID})"; then
              git push origin sanitizer-results   # not swallowed -- a push failure fails the job
            else
              echo "no changes to commit"
            fi )

      - name: Upload sanitizer dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-dashboard-${{ github.run_id }}
          path: dashboard
