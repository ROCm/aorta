name: Sanitizers Nightly

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# The dashboard is surfaced via the run's job summary + an uploaded artifact.
# GitHub Pages is owned solely by the "Pages" workflow (one Pages site per repo),
# so this workflow deliberately does not request pages/id-token.
permissions:
  contents: read

concurrency:
  group: sanitizers-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_NAME: aorta-ci-gpu
  # Immutable RocJITsu input. rocm-systems is public, so the checkout needs no
  # token. TODO(#330): replace this branch ref with the reviewed commit SHA so
  # the gate pins an immutable input rather than a mutable branch.
  ROCJITSU_REF: "shared/rocjitsu/sanitizers"

jobs:
  sanitizers-gpu:
    name: gfx950 sanitizer regression
    # Must match a real online runner: the MI350 host is labelled
    # `self-hosted, gpu, mi350x` (same set the other GPU workflows target, e.g.
    # gpu-tests.yml / eval-reusable.yml use `self-hosted, gpu`).
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    steps:
      # Sibling GPU jobs (gpu-tests.yml et al.) run aorta in a root ROCm CI
      # container that leaves root-owned artifacts (e.g. results/gpu_smoke) in
      # the mounted checkout. actions/checkout's `git clean` runs as the runner
      # user and cannot delete them. Reclaim ownership first via a throwaway
      # root container (repo scripts aren't checked out yet here).
      - name: Reclaim workspace ownership
        run: |
          ws="${{ github.workspace }}"
          [ -d "$ws" ] || exit 0
          uidgid="$(id -u):$(id -g)"
          # Pinned by digest for supply-chain safety / reproducibility on the
          # self-hosted runner (busybox:1.37).
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          # Repo scripts aren't checked out yet, so resolve docker access inline.
          # Support runners with direct docker, sudo docker, or only host sudo.
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          else
            sudo chown -R "$uidgid" "$ws" || true
          fi

      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up ROCm CI container
        uses: ./.github/actions/rocm-ci-setup
        with:
          rocm-shared-key: ${{ secrets.ROCM_SHARED_KEY }}

      # Host hipcc is not a reliable ROCm toolchain (e.g. it may point at a
      # missing /opt/rocm/llvm/bin/clang-*). Run the full sanitizer gate inside
      # the same pinned ROCm container as gpu-tests.yml / eval-reusable.yml.
      # Workspace-relative paths keep artifacts visible on the host for upload.
      - name: Run sanitizer regression
        run: |
          bash scripts/ci/docker_cmd.sh exec \
            -e ROCJITSU_REF="${ROCJITSU_REF}" \
            "${{ env.CONTAINER_NAME }}" bash -lc '
            set -euo pipefail
            cd /workspace/aorta
            SANITIZER_ROOT=".sanitizer-nightly"
            ROCJITSU_SRC="${SANITIZER_ROOT}/rocjitsu-src"
            ROCJITSU_BUILD="${SANITIZER_ROOT}/rocjitsu-build"
            SANITIZER_OUT="${SANITIZER_ROOT}/out"
            FIXTURES=recipes/sanitizers/fixtures

            python -m pip install --upgrade pip
            pip install -e ".[tests]"
            # The pinned ROCm CI container ships hipcc but not cmake/ninja, so
            # the rocjitsu build below hit `cmake: command not found` (exit 127
            # on run 31152762604). Provision both from PyPI (real prebuilt
            # binaries, no image change needed); the `command -v ninja` check
            # below then selects the faster Ninja generator.
            pip install cmake ninja
            # rocjitsu's CMake does `find_package(zstd REQUIRED)` in config mode,
            # but the ROCm base image (Ubuntu 22.04) ships neither libzstd's
            # headers nor a zstd CMake package config, so configure aborted with
            # "Could not find ... zstdConfig.cmake" (run 31155146550). Install
            # the dev headers/lib (container runs as root) and point CMake at the
            # in-repo Findzstd shim that wraps them into the expected
            # zstd::libzstd_shared target.
            apt-get update && apt-get install -y --no-install-recommends libzstd-dev
            RJ_CMAKE_MODULE_PATH="$(pwd)/scripts/sanitizers/cmake"

            rm -rf "${ROCJITSU_SRC}" "${ROCJITSU_BUILD}"
            git clone --filter=blob:none https://github.com/ROCm/rocm-systems.git "${ROCJITSU_SRC}"
            git -C "${ROCJITSU_SRC}" checkout "${ROCJITSU_REF}"
            echo "ROCJITSU checkout: $(git -C "${ROCJITSU_SRC}" rev-parse HEAD)"
            if command -v ninja >/dev/null 2>&1; then
              cmake -S "${ROCJITSU_SRC}/emulation/rocjitsu" -B "${ROCJITSU_BUILD}" -GNinja \
                -DCMAKE_MODULE_PATH="${RJ_CMAKE_MODULE_PATH}"
            else
              cmake -S "${ROCJITSU_SRC}/emulation/rocjitsu" -B "${ROCJITSU_BUILD}" \
                -DCMAKE_MODULE_PATH="${RJ_CMAKE_MODULE_PATH}"
            fi
            cmake --build "${ROCJITSU_BUILD}" --parallel \
              --target rj_waitcheck rocjitsu_dbi_hooks
            export ROCJITSU_BUILD="${ROCJITSU_BUILD}"

            mkdir -p "${FIXTURES}/bin" "${FIXTURES}/isa"
            hipcc --offload-arch=gfx950 -O1 -g "${FIXTURES}/repro/consan_lds_race.hip" \
              -o "${FIXTURES}/bin/consan_lds_race"
            hipcc --offload-arch=gfx950 -O1 -g "${FIXTURES}/repro/consan_lds_race_2wave.hip" \
              -o "${FIXTURES}/bin/consan_lds_race_2wave"
            python scripts/sanitizers/prepare_gemm_isa.py \
              --csv "${FIXTURES}/gemm_shapes_unique.csv" --out "${FIXTURES}/isa" --top-n 3

            # Positive-control recipes intentionally exit non-zero via the
            # guardrail-safe CLI. The authoritative gate is the baseline
            # comparator below, so these only need to produce reports.
            mkdir -p "${SANITIZER_OUT}/waitcheck" "${SANITIZER_OUT}/consan-clean" "${SANITIZER_OUT}/consan-racy"
            aorta sweep run --recipe recipes/sanitizers/daily-waitcheck-gemm.yaml \
              --output-dir "${SANITIZER_OUT}/waitcheck" || true
            aorta sweep run --recipe recipes/sanitizers/daily-consan-clean.yaml \
              --output-dir "${SANITIZER_OUT}/consan-clean" || true
            aorta sweep run --recipe recipes/sanitizers/daily-consan-racy.yaml \
              --output-dir "${SANITIZER_OUT}/consan-racy" || true

            python scripts/sanitizers/compare_verdict_baselines.py "${SANITIZER_OUT}"
          '

      - name: Reclaim results ownership
        if: always()
        run: |
          ws="${{ github.workspace }}"
          uidgid="$(id -u):$(id -g)"
          busybox="busybox:1.37@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          if docker info >/dev/null 2>&1; then
            docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          elif sudo -n docker info >/dev/null 2>&1; then
            sudo docker run --rm -v "$ws":/ws "$busybox" chown -R "$uidgid" /ws || true
          else
            sudo chown -R "$uidgid" "$ws" || true
          fi

      - name: Upload sanitizer results
        # Always upload whatever ran, even when an earlier step (e.g. the baseline
        # comparison) failed, so the publish job can render the failure with any
        # partial evidence instead of the run silently producing nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: .sanitizer-nightly/out
          if-no-files-found: warn

      - name: Clean up build/temp state
        if: always()
        run: |
          rm -rf .sanitizer-nightly \
                 recipes/sanitizers/fixtures/bin recipes/sanitizers/fixtures/isa

      - name: Tear down ROCm CI container
        if: always()
        working-directory: docker
        run: bash ../scripts/ci/docker_compose.sh --env-file .env.ci -f docker-compose.build.yaml down -v

  publish:
    name: publish sanitizer dashboard
    needs: sanitizers-gpu
    # Run even when the GPU job failed (to publish the failure, not a stale green
    # page) but NOT when it was skipped. Publish ONLY from main: a workflow_dispatch
    # branch run still executes sanitizers-gpu and uploads its artifact, but must
    # never push branch output onto the public sanitizer-results branch (that would
    # bypass branch protection). Branch runs therefore produce artifacts only.
    if: >-
      always() &&
      needs.sanitizers-gpu.result != 'skipped' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push dashboard to the sanitizer-results branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        # A failed GPU job may leave no artifact at all; don't hard-fail the
        # publish job -- we still want to record the failure on the public page.
        continue-on-error: true
        with:
          name: sanitizer-nightly-${{ github.run_id }}
          path: incoming
      - name: Record run status
        # Manifest consumed by gen_sanitizer_dashboard.py (--status) to render a
        # stale banner, and persisted to the data branch so Pages can tell a
        # healthy snapshot from a stale one on every subsequent deploy.
        env:
          GPU_RESULT: ${{ needs.sanitizers-gpu.result }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [ "${GPU_RESULT}" = "success" ]; then healthy=true; else healthy=false; fi
          python - "$healthy" "$GPU_RESULT" > status.json <<'PY'
          import json, os, sys
          healthy = sys.argv[1] == "true"
          conclusion = sys.argv[2]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          from datetime import datetime, timezone
          print(json.dumps({
              "healthy": healthy,
              "conclusion": conclusion,
              "run_id": run_id,
              "run_url": f"{server}/{repo}/actions/runs/{run_id}",
              "commit": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "date": datetime.now(tz=timezone.utc).isoformat(timespec="seconds"),
          }, indent=2, sort_keys=True))
          PY
          cat status.json

      - name: Generate sanitizer dashboard
        run: |
          python scripts/sanitizers/gen_sanitizer_dashboard.py \
            --results-dir incoming \
            --baselines recipes/sanitizers/fixtures/expected/verdict_baselines.json \
            --commit "${GITHUB_SHA}" --run-label "run ${GITHUB_RUN_ID}" \
            --status status.json \
            --out-dir dashboard
          cat dashboard/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update sanitizer-results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -d dashboard ] || { echo "no dashboard/; skipping publish"; exit 0; }
          date="$(date -u +%Y-%m-%d)"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          # Fail closed: distinguish a genuinely-absent sanitizer-results branch
          # (create the orphan) from a transport/auth failure (must NOT be treated
          # as "branch absent"). git ls-remote --exit-code: 0=present, 2=absent,
          # else=error.
          set +e
          git ls-remote --exit-code --heads "$repo_url" sanitizer-results >/dev/null 2>&1
          lsr=$?
          set -e
          if [ "$lsr" -eq 0 ]; then
            git clone --depth 1 --branch sanitizer-results "$repo_url" "$tmp"
          elif [ "$lsr" -eq 2 ]; then
            echo "sanitizer-results branch absent; creating it"
            git clone --depth 1 "$repo_url" "$tmp"
            ( cd "$tmp" && git checkout --orphan sanitizer-results && git rm -rf . >/dev/null 2>&1 || true )
          else
            echo "::error::cannot reach sanitizer-results (git ls-remote exit ${lsr}); failing closed"
            exit 1
          fi
          rm -rf "$tmp/dashboard"
          cp -a dashboard "$tmp/dashboard"
          ( cd "$tmp"
            git add -A
            if git -c user.name=aorta-ci -c user.email=aorta-ci@users.noreply.github.com \
                 commit -m "sanitizer dashboard ${date}"; then
              git push origin sanitizer-results   # not swallowed -- a push failure fails the job
            else
              echo "no changes to commit"
            fi )

      - name: Upload sanitizer dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-dashboard-${{ github.run_id }}
          path: dashboard
