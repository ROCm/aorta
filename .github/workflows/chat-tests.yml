name: Chat Tests

# Real-import gate for `aorta chat` (Decision 14a).
#
# cpu-tests.yml is the required merge gate and deliberately installs no chat
# extra, so `tests/chat/` skips itself there: its conftest collect-ignores the
# directory when `langchain_core` is absent, because a base `pip install
# amd-aorta` (pyyaml + click) is a supported and common configuration. That
# keeps the required gate fast and keeps a ~400 MB resolution off the critical
# path of every PR -- but it also means nothing in the required gate ever
# imports langchain, langgraph, sqlite-vec or Chainlit. This workflow is where
# that actually happens.
#
# Two conventions are copied from cpu-tests.yml rather than reinvented, and both
# are load-bearing if this is ever made a required check on `main`:
#
#   1. Path filtering lives in the `changes` job, NOT on the `pull_request`
#      trigger. A workflow skipped by trigger-level path filtering leaves its
#      checks Pending forever rather than reporting, so a required check would
#      make every non-chat PR permanently unmergeable.
#   2. The per-version `pytest (chat, py3.x)` legs are NOT the check to require.
#      GitHub evaluates a job-level `if` before expanding a matrix, so when the
#      matrix is skipped those contexts are never created (actions/runner#952).
#      The always-running `required` aggregator at the bottom is the one stable
#      context.
#
# See https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks

on:
  pull_request:
  push:
    branches:
      - main

# contents: read to check out; pull-requests: read so the `changes` gate can
# list the files a PR touches.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: chat-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate on a GitHub-hosted runner, replacing a trigger-level `paths:`
  # filter. Non-PR triggers always report true so pushes to main run everything.
  #
  # Unlike the CPU gate -- the catch-all, which uses a deny-list -- chat is a
  # self-contained subtree with two sanctioned importers, so this is an
  # allow-list in the shape gpu-tests.yml uses. It is still fail-open: an
  # indeterminate answer runs the suite rather than handing a chat-touching PR
  # a green check without testing it.
  changes:
    name: detect chat-relevant changes
    runs-on: ubuntu-latest
    outputs:
      chat: ${{ steps.filter.outputs.chat }}
    steps:
      - name: Decide whether the chat suite applies
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "$EVENT_NAME is not a pull request; running the full chat suite."
            echo "chat=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Assigning inside `if !` keeps `set -e` from aborting on failure.
          if ! files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                          --paginate --jq '.[].filename, (.previous_filename // empty)' 2>&1)"; then
            echo "::warning::Could not list the PR's files, so running the chat" \
                 "suite rather than guessing. gh said: ${files}"
            echo "chat=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$files" ]; then
            echo "::warning::The PR file list came back empty, which should not" \
                 "happen for a real PR; running the chat suite."
            echo "chat=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trailing `*` is a `case` glob, which matches `/` too, so it covers
          # whole subtrees. Single-quoted and expanded via "${patterns[@]}" so
          # the shell never filename-expands them -- they must reach `case` as
          # literal patterns.
          patterns=(
            'src/aorta/chat/*'
            'src/aorta/cli/chat.py'
            # The second sanctioned importer of aorta.chat (Decision 7a puts the
            # agent's proposer on the chat provider factory), and the module the
            # boundary tests assert stays free of langchain.
            'src/aorta/agent/llm.py'
            # chat/tools/artifacts.py is a thin adapter over these readers, so a
            # change here reaches the assistant without touching src/aorta/chat.
            'src/aorta/artifacts/*'
            'src/aorta/_user_paths.py'
            # aorta bundle must keep refusing to package the chat profile
            # (Decision 9b), which tests/chat asserts.
            'src/aorta/bundle/writer.py'
            'tests/chat/*'
            'tests/cli/test_chat.py'
            'tests/cli/test_chat_boundaries.py'
            # Both are skipif-gated on langchain_core, so the required CPU gate
            # collects them and skips 36 of their 65 tests. This job is the only
            # one with the extra, so it is the only place they ever execute.
            'tests/cli/test_chat_index_cli.py'
            'tests/cli/test_chat_index_workflows.py'
            # TestRealProviderResolution resolves the provider layer for real,
            # so it needs the extra and only runs here.
            'tests/agent/test_llm_providers.py'
            # The chat-* extras, their environment markers, and the entry-point
            # groups all live here.
            'pyproject.toml'
            '.github/workflows/chat-tests.yml'
          )

          chat=false
          while read -r file; do
            [ -n "$file" ] || continue
            for pattern in "${patterns[@]}"; do
              # shellcheck disable=SC2254  # unquoted glob match is intentional
              case "$file" in
                $pattern)
                  echo "chat-relevant change: $file (matched $pattern)"
                  chat=true
                  break 2
                  ;;
              esac
            done
          done <<< "$files"

          if [ "$chat" = false ]; then
            echo "No chat-relevant paths changed; the chat matrix will be skipped."
            echo "The 'required' aggregator still reports and stays green."
          fi
          echo "chat=$chat" >> "$GITHUB_OUTPUT"

  tests:
    name: pytest (chat, py${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    needs: changes
    # These per-version legs are deliberately NOT the required checks; the
    # `required` job below is. See the header.
    if: needs.changes.outputs.chat == 'true'
    strategy:
      fail-fast: false
      # Explicit `include` rather than a cross product, because the extras are
      # not uniform across the range (Decision 13a):
      #
      #   * chat-cli is py3.11+. It is NOT py3.10, because aorta/chat/config.py
      #     reads the profile with stdlib `tomllib`. The 3.10 leg that
      #     cpu-tests.yml runs covers the only thing 3.10 must still do here,
      #     which is print an install hint instead of an ImportError.
      #   * chat-ui adds Chainlit, which declares `Requires-Python <3.14`, so it
      #     can only be asked for on a leg below that. The py3.14 leg installs
      #     chat-cli. Naming the extra per leg rather than letting Chainlit's
      #     marker sort it out is deliberate: the marker means pip resolves it
      #     to nothing rather than failing, and "quietly resolved to nothing" is
      #     exactly the state that makes an install look successful and a
      #     feature look broken.
      #   * chat-all is chat-ui plus LiteLLM and nothing else, so the py3.13 leg
      #     asks for it directly. There is no torch tier for it to drag in.
      matrix:
        include:
          - python-version: "3.11"
            extras: chat-cli
          - python-version: "3.12"
            extras: chat-cli
          # One leg carries the full stack -- Chainlit, LiteLLM and the cluster
          # agents -- at the top of Chainlit's supported range, which is where a
          # `Requires-Python` bump on its side will show up first. The
          # cancellation contract crosses BaseTool into run_triage, so testing
          # either extra alone cannot exercise it.
          #
          # cia is here because the chat tools import through aorta.cia, so
          # without it the staging and prompt tests fail on a missing dspy
          # rather than on anything they are about. Skipping them instead would
          # mean the staging-collision fix has no lane that runs it.
          - python-version: "3.13"
            extras: chat-all,cia
            litellm: "yes"
          - python-version: "3.14"
            extras: chat-cli
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Track the input this job actually resolves from: the package
          # metadata (extras). This job never installs requirements-dev.txt.
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }},tests]"

      # Without this the gate can pass by doing nothing. tests/chat/conftest.py
      # collect-ignores the whole directory when langchain_core is missing, so a
      # resolution that silently dropped the extra -- an environment marker that
      # stopped matching, a yanked wheel, a new interpreter with no wheels yet --
      # would report "0 failed" and look green. Import the packages the extra is
      # supposed to have brought, and fail loudly if they are not there.
      - name: Verify the chat extra actually installed
        env:
          EXTRAS: ${{ matrix.extras }}
          WITH_LITELLM: ${{ matrix.litellm }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import sys

          extras = os.environ["EXTRAS"]
          selected = set(extras.split(","))
          required = [
              "langchain_core",
              "langchain_openai",
              "langgraph",
              "openai",
              "sqlite_vec",
              "fastembed",
          ]
          if selected & {"chat-ui", "chat-all"}:
              required.append("chainlit")
          if "cia" in selected:
              required.append("dspy")
          if os.environ.get("WITH_LITELLM") == "yes":
              required += ["litellm", "langchain_litellm"]
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              sys.exit(
                  f"the {extras} extra resolved without {missing}. tests/chat/ would "
                  "have skipped itself and this gate would have passed without "
                  "importing anything."
              )
          print(f"{extras} present:", ", ".join(required))
          PY

      # The plan's worst outcome, asserted rather than trusted: a chat extra
      # that reaches torch makes pip resolve the default PyPI wheel, which is
      # the CUDA build, and deposits ~2.7 GB of nvidia-* onto what is supposed
      # to be an AMD toolkit. Nothing here should get near it, so a leg that
      # does has regressed something and must say so loudly.
      - name: Assert no torch and no CUDA wheels came along
        run: |
          set -euo pipefail
          # Captured first, so a pip that failed to run aborts the step rather
          # than reading as an empty (and therefore clean) package list.
          installed="$(python -m pip list --format=freeze)"
          found="$(printf '%s\n' "$installed" | grep -E '^(torch|nvidia-)' || true)"
          if [ -n "$found" ]; then
            echo "A chat extra pulled in torch or CUDA wheels:"
            echo "$found"
            exit 1
          fi
          echo "No torch, no nvidia-* wheels in $(printf '%s\n' "$installed" | grep -c .) packages."

      # The chat suite plus the four import-boundary tests, which live under
      # tests/cli/ because they are pure AST and must also run on a base
      # install. They are cheap and this is the job that can also prove the
      # no-langchain property against an interpreter that really has langchain.
      #
      # tests/agent/test_llm_providers.py joins them for the same reason in the
      # other direction: its TestRealProviderResolution group deliberately does
      # not mock the chat model, because Decision 7a is only proven by an
      # unmocked resolution. That group skips itself on the required CPU gate,
      # which installs no chat extra, so without this line it would be gated
      # everywhere and run nowhere.
      #
      # test_chat_index_cli.py and test_chat_index_workflows.py are here for
      # exactly that reason. Both are skipif-gated on langchain_core, so the
      # required CPU gate collects them and skips every test that needs the
      # extra -- 36 of the 65 between them. This is an allow-list, not a
      # directory, so a file absent from it runs in no job at all.
      - name: Run the chat test suite
        run: |
          pytest tests/chat tests/cli/test_chat.py tests/cli/test_chat_boundaries.py \
            tests/cli/test_chat_index_cli.py tests/cli/test_chat_index_workflows.py \
            tests/agent/test_llm_providers.py \
            -m "not gpu and not rocm" -n auto

  # Stable aggregator, in the shape cpu-tests.yml uses. Branch protection (if
  # this is ever made required) must require THIS job, not the per-version legs:
  # a matrix skipped by a job-level `if` never emits their contexts, so a
  # required check pinned to one would hang the PR forever
  # The floor is a claim that the declared minimum can run this code, and
  # nothing was checking it. Every leg above resolves the newest LangGraph, so
  # an import added here that only exists in a later release passes CI and
  # fails for anyone who installs the minimum the metadata permits -- which is
  # exactly what happened with langgraph.config.get_stream_writer against the
  # old >=0.2.0 floor.
  minimum-langgraph:
    name: pytest (chat, langgraph floor)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chat == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Resolved as one set, not installed and then downgraded. Pinning
      # LangGraph afterwards leaves the langchain-* packages at versions picked
      # for a newer one, and the resulting ImportErrors are artefacts of the
      # half-migrated environment rather than anything a user would hit.
      - name: Install the chat extra with LangGraph pinned to the declared floor
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          floor=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          print(re.search(r'"langgraph>=([0-9.]+)', text).group(1))
          PY
          )
          echo "declared floor: ${floor}"
          python -m pip install -e '.[chat-cli,tests]' "langgraph==${floor}"
          python - <<'PY'
          import importlib.metadata as md
          for pkg in ("langgraph", "langchain-core", "langchain-openai"):
              print(f"  {pkg}: {md.version(pkg)}")
          PY

      - name: The imports the floor exists for
        run: |
          python - <<'PY'
          # The two the floor was raised for. An ImportError here means the
          # declared minimum cannot run the code that declares it.
          from langgraph.config import get_stream_writer
          from aorta.chat.graph import nodes
          from aorta.chat import session
          print("get_stream_writer and the graph import on the floor")
          PY

      - name: The custom stream mode works on the floor
        run: |
          python -m pytest tests/chat/test_langgraph_floor.py tests/chat/test_streamed_steps.py -q

  # (actions/runner#952). This job has no matrix and `if: always()`, so its
  # single context reports on every PR.
  required:
    name: Chat tests
    runs-on: ubuntu-latest
    needs: [changes, tests, minimum-langgraph]
    if: always()
    steps:
      - name: Collapse the chat matrix result into one check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          FLOOR_RESULT: ${{ needs.minimum-langgraph.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT} tests=${TESTS_RESULT} floor=${FLOOR_RESULT}"

          # A broken relevance gate is not a pass.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The chat relevance gate did not succeed (${CHANGES_RESULT})."
            exit 1
          fi

          case "$TESTS_RESULT" in
            success)  echo "Chat matrix passed." ;;
            skipped)  echo "Chat matrix skipped (no chat-relevant change)." ;;
            *)        echo "Chat matrix did not pass (${TESTS_RESULT})."; exit 1 ;;
          esac

          # Counted separately: the matrix resolves the newest LangGraph, so a
          # green matrix says nothing about the minimum the metadata permits.
          case "$FLOOR_RESULT" in
            success)  echo "The declared LangGraph floor runs the code." ;;
            skipped)  echo "Floor check skipped (no chat-relevant change)." ;;
            *)        echo "The declared LangGraph floor did not pass (${FLOOR_RESULT})."; exit 1 ;;
          esac
