[pytest]
# Pytest configuration for AORTA

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# tests/chat/ is the only async suite in the tree (the agent graph is
# awaited), and every one of its coroutine tests is a plain `async def test_*`
# with no marker. `auto` is therefore the mode that matches what is written.
# The option is inert without pytest-asyncio, which only the chat test
# environment installs.
asyncio_mode = auto

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for full workflows
    slow: Tests that take a long time to run
    gemm: Tests for GEMM analysis pipeline
    hw_queue: Tests for hw_queue_eval subpackage
    gpu: Tests that require GPU hardware
    rocm: Tests that require ROCm specifically
